<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Life Journal Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-ivory: #FAF7F2;
      --card-surface: #FFFCF7;
      --border-sand: #E6DFD3;
      --ink-primary: #2B2623;
      --ink-muted: #786E65;
      --accent-sage: #3F6250;
      --accent-sage-soft: #EBF1ED;
      --accent-rose: #A84A5C;
      --accent-rose-soft: #F9ECEE;
      --accent-amber: #A66E2E;
      --accent-amber-soft: #FBF3E6;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background-color: var(--bg-ivory);
      color: var(--ink-primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Optional 390x844 mobile frame preview on desktop */
    @media (min-width: 640px) {
      body.mobile-frame-mode {
        background-color: #EAE4DA;
        padding: 20px 0;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
      }
      body.mobile-frame-mode #app-shell {
        width: 390px;
        min-height: 844px;
        max-height: 844px;
        overflow-y: auto;
        border-radius: 38px;
        border: 8px solid #2B2623;
        box-shadow: 0 24px 60px rgba(43, 38, 35, 0.22);
        background-color: var(--bg-ivory);
      }
    }

    .card {
      background-color: var(--card-surface);
      border: 1px solid var(--border-sand);
      border-radius: 18px;
      box-shadow: 0 1px 3px rgba(43, 38, 35, 0.03);
    }

    .btn-pill {
      transition: all 0.15s ease;
    }
    .btn-pill:active {
      transform: scale(0.96);
    }

    input, select, textarea {
      font-family: inherit;
      color: var(--ink-primary);
      background-color: #FFFFFF;
      border: 1px solid var(--border-sand);
      border-radius: 12px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent-sage);
      box-shadow: 0 0 0 2px rgba(63, 98, 80, 0.12);
    }
  </style>
</head>
<body>
  <div id="app-shell" class="w-full max-w-2xl mx-auto min-h-screen flex flex-col justify-between bg-[#FAF7F2]">
    <!-- Top Header + Symbol Navigation -->
    <header class="sticky top-0 z-30 bg-[#FAF7F2]/95 backdrop-blur-sm border-b border-[#E6DFD3] px-3 pt-2.5 pb-2">
      <div class="flex items-center justify-between mb-2 px-1">
        <div class="flex items-center gap-2">
          <span class="text-sm font-semibold tracking-tight text-[#2B2623]" id="header-date-label">2026-11-25</span>
          <span id="sync-status-dot" class="inline-block w-2 h-2 rounded-full bg-[#B5ABA0]" title="Local storage active"></span>
        </div>
        <button
          id="frame-toggle-btn"
          onclick="toggleMobileFrame()"
          class="hidden sm:inline-flex items-center gap-1 text-xs px-2.5 py-1 rounded-full border border-[#E6DFD3] bg-[#FFFCF7] text-[#786E65] hover:text-[#2B2623]"
          title="Toggle 390x844 Mobile Frame Preview"
        >
          📱 Mobile Frame
        </button>
      </div>

      <!-- Symbol-Only Pill Navigation -->
      <nav id="top-nav" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-0.5" aria-label="Primary Navigation"></nav>
    </header>

    <!-- Main Dynamic View Container -->
    <main id="main-content" class="flex-1 px-3.5 py-3.5 space-y-3"></main>

    <!-- Bottom Footer: Achievements + Date Navigation + Utility & Cloud Controls -->
    <footer class="px-3.5 pt-2 pb-5 space-y-2.5 border-t border-[#E6DFD3] bg-[#FAF7F2]">
      <!-- Achievements Strip (Always at the bottom above footer bar) -->
      <div id="achievements-container"></div>

      <!-- Date Navigator & Utility/Cloud Bar -->
      <div class="card px-2.5 py-2 flex flex-wrap items-center justify-between gap-1.5">
        <!-- Date Controls -->
        <div class="flex items-center gap-1">
          <button onclick="shiftDate(-2)" class="btn-pill w-8 h-8 rounded-xl bg-[#FAF7F2] border border-[#E6DFD3] flex items-center justify-center text-xs" title="2 Days Ago" aria-label="2 Days Ago">⏪</button>
          <button onclick="shiftDate(-1)" class="btn-pill w-8 h-8 rounded-xl bg-[#FAF7F2] border border-[#E6DFD3] flex items-center justify-center text-xs" title="Yesterday" aria-label="Yesterday">◀</button>
          <button onclick="goToday()" class="btn-pill w-8 h-8 rounded-xl bg-[#EBF1ED] border border-[#C7D7CE] text-[#3F6250] flex items-center justify-center text-xs font-bold" title="Today" aria-label="Today">●</button>
          <input
            type="date"
            id="footer-date-picker"
            onchange="setSelectedDate(this.value)"
            class="h-8 px-2 text-xs font-medium bg-[#FAF7F2] border border-[#E6DFD3] rounded-xl"
            aria-label="Select Date"
          />
          <button onclick="shiftDate(1)" class="btn-pill w-8 h-8 rounded-xl bg-[#FAF7F2] border border-[#E6DFD3] flex items-center justify-center text-xs" title="Tomorrow" aria-label="Tomorrow">▶</button>
          <button onclick="shiftDate(2)" class="btn-pill w-8 h-8 rounded-xl bg-[#FAF7F2] border border-[#E6DFD3] flex items-center justify-center text-xs" title="Day After Tomorrow" aria-label="Day After Tomorrow">⏩</button>
        </div>

        <!-- Settings, Cloud Sync & Backup Icons -->
        <div class="flex items-center gap-1">
          <button onclick="openModal('settings')" class="btn-pill w-8 h-8 rounded-xl bg-[#FAF7F2] border border-[#E6DFD3] flex items-center justify-center text-sm" title="Cycle & Year Settings" aria-label="Cycle and Year Settings">⚙️</button>
          <button onclick="openModal('cloud')" class="btn-pill w-8 h-8 rounded-xl bg-[#FAF7F2] border border-[#E6DFD3] flex items-center justify-center text-sm" title="Supabase Cloud Sync" aria-label="Supabase Cloud Sync">☁️</button>
          <button onclick="syncNow()" class="btn-pill w-8 h-8 rounded-xl bg-[#FAF7F2] border border-[#E6DFD3] flex items-center justify-center text-sm" title="Sync Now" aria-label="Sync Now">🔄</button>
          <button onclick="toggleAutoSync()" id="auto-sync-btn" class="btn-pill w-8 h-8 rounded-xl bg-[#FAF7F2] border border-[#E6DFD3] flex items-center justify-center text-sm" title="Toggle Auto-Sync" aria-label="Toggle Auto-Sync">⏱️</button>
          <button onclick="exportJSON()" class="btn-pill w-8 h-8 rounded-xl bg-[#FAF7F2] border border-[#E6DFD3] flex
