<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人生活全景管理与日记本</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script>
    // Tailwind design tokens for ivory/warm cream minimal aesthetic
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ivory: '#FAF8F5',
            linen: '#EFECE6',
            sage: '#4A6B5D',
            slateblue: '#4A607A',
            terracotta: '#C26D53',
            amberwarm: '#C88A36',
            ink: {
              900: '#232725',
              700: '#49504C',
              500: '#767E79',
            },
          },
          fontFamily: {
            serif: ['"Noto Serif SC"', 'Georgia', 'serif'],
            sans: ['"Noto Sans SC"', 'sans-serif'],
          },
          boxShadow: {
            card: '0 4px 20px -4px rgba(35, 39, 37, 0.06)',
          },
        },
      },
    };
  </script>
  <style>
    /* Base styling for warm ivory surface and legible typography */
    body {
      background-color: #FAF8F5;
      color: #232725;
      font-family: "Noto Sans SC", sans-serif;
      overflow-x: hidden;
    }
    .font-editorial {
      font-family: "Noto Serif SC", Georgia, serif;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #D6D0C4;
      border-radius: 999px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Toast Banner (replaces native alert/confirm) -->
  <div id="toastBanner" class="fixed bottom-4 left-4 right-4 sm:left-auto sm:right-5 sm:bottom-5 z-50 hidden max-w-sm mx-auto sm:mx-0 bg-ink-900 text-white px-4 py-3.5 rounded-2xl shadow-xl border border-ink-700">
    <div class="flex items-start gap-2.5 text-xs">
      <span id="toastIcon" class="text-base leading-none shrink-0 mt-0.5">🌿</span>
      <div class="flex-1 min-w-0">
        <div id="toastTitle" class="font-bold text-white">提示</div>
        <div id="toastMsg" class="text-ivory/80 mt-0.5 break-words"></div>
      </div>
      <button type="button" onclick="hideToast()" class="text-ivory/60 hover:text-white font-bold px-1 shrink-0">✕</button>
    </div>
  </div>

  <!-- Sticky Top Header -->
  <header class="sticky top-0 z-40 bg-ivory/95 backdrop-blur border-b border-linen">
    <div class="max-w-7xl mx-auto px-3.5 sm:px-6 py-2.5 sm:py-3 flex flex-col md:flex-row md:items-center md:justify-between gap-2.5">
      <div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2.5 min-w-0">
          <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-2xl bg-sage text-white flex items-center justify-center text-base sm:text-lg shadow-sm shrink-0">
            🌿
          </div>
          <div class="min-w-0">
            <h1 class="font-editorial text-sm sm:text-lg font-bold text-ink-900 truncate">个人生活全景管理与日记本</h1>
            <p class="text-[11px] text-ink-500 truncate">本地缓存 · 自动云端同步 · JSON 备份</p>
          </div>
        </div>

        <!-- Mobile Settings Trigger -->
        <button type="button" onclick="toggleCloudDrawer()" class="md:hidden px-3 py-2 rounded-2xl bg-white border border-linen text-ink-900 text-xs font-semibold shrink-0 active:scale-[0.99]">
          ⚙ 设置
        </button>
      </div>

      <!-- Date Picker & Quiet Status / Settings Trigger -->
      <div class="flex flex-wrap items-center justify-between sm:justify-end gap-1.5 sm:gap-2">
        <div class="flex items-center bg-white border border-linen rounded-2xl p-1 flex-1 sm:flex-initial justify-between sm:justify-start">
          <button type="button" onclick="shiftDate(-1)" title="前一天" class="px-3 py-1.5 sm:px-2.5 sm:py-1 rounded-xl text-xs font-bold text-ink-700 hover:bg-linen transition">
            ◀
          </button>
          <input
            type="date"
            id="headerDatePicker"
            onchange="setSelectedDate(this.value)"
            class="bg-transparent px-1.5 sm:px-2 py-1 text-xs font-bold text-ink-900 focus:outline-none text-center"
          />
          <button type="button" onclick="shiftDate(1)" title="后一天" class="px-3 py-1.5 sm:px-2.5 sm:py-1 rounded-xl text-xs font-bold text-ink-700 hover:bg-linen transition">
            ▶
          </button>
          <button type="button" onclick="jumpToToday()" class="ml-0.5 px-2.5 py-1.5 sm:py-1 rounded-xl bg-sage/10 text-sage hover:bg-sage/20 text-xs font-bold transition shrink-0">
            今
          </button>
        </div>

        <!-- Quiet status indicator + on-demand settings drawer button -->
        <div class="flex items-center gap-1.5">
          <button
            type="button"
            id="headerSyncPill"
            onclick="toggleCloudDrawer()"
            title="点击打开设置"
            class="px-2.5 py-1.5 rounded-2xl bg-white border border-linen text-[11px] font-semibold text-ink-500 hover:bg-linen/60 transition shrink-0"
          >
            本地已存
          </button>
          <button
            type="button"
            onclick="toggleCloudDrawer()"
            class="hidden md:inline-flex px-3 py-2 rounded-2xl bg-white hover:bg-linen border border-linen text-ink-900 text-xs font-semibold transition shrink-0"
          >
            ⚙ 设置
          </button>
        </div>
      </div>
    </div>

    <!-- Top Navigation Tabs: "主页" + 8 Pillars + "日记" + "购买清单" -->
    <nav class="max-w-7xl mx-auto px-3.5 sm:px-6 pb-2.5 overflow-x-auto no-scrollbar">
      <div id="navTabsContainer" class="flex items-center gap-1.5 min-w-max"></div>
    </nav>
  </header>

  <!-- On-Demand Modal/Drawer: "设置" (Hidden by default) -->
  <div id="cloudSyncPanel" onclick="handleDrawerBackdropClick(event)" class="hidden fixed inset-0 z-50 bg-ink-900/35 backdrop-blur-[2px] flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-white w-full max-w-xl rounded-t-3xl sm:rounded-3xl p-5 border border-linen shadow-xl space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between gap-2 pb-2 border-b border-linen">
        <div class="flex items-center gap-2">
          <span class="text-sm font-bold text-ink-900">⚙ 设置</span>
          <span id="cloudStatusBadge" class="px-2.5 py-0.5 rounded-full text-[11px] font-semibold bg-linen text-ink-700">本地模式</span>
        </div>
        <button type="button" onclick="toggleCloudDrawer()" class="px-2.5 py-1 rounded-xl bg-ivory border border-linen text-xs font-semibold text-ink-700">
          关闭
        </button>
      </div>

      <!-- JSON Export / Import Backup & Manual Cloud Trigger -->
      <div class="p-3.5 rounded-2xl bg-ivory border border-linen space-y-2">
        <div class="text-xs font-bold text-ink-900">备份与同步</div>
        <div class="flex flex-wrap items-center gap-2">
          <button type="button" onclick="exportBackupJson()" class="px-3.5 py-2 rounded-xl bg-sage hover:bg-sage/90 text-white text-xs font-semibold transition">
            ⬇ 导出 JSON
          </button>
          <label class="px-3.5 py-2 rounded-xl bg-white hover:bg-linen border border-linen text-ink-900 text-xs font-semibold cursor-pointer transition">
            ⬆ 导入 JSON
            <input type="file" accept=".json,application/json" onchange="importBackupJson(event)" class="hidden" />
          </label>
          <button type="button" onclick="syncStateToCloud(true)" class="px-3.5 py-2 rounded-xl bg-slateblue hover:bg-slateblue/90 text-white text-xs font-semibold transition">
            ☁ 立即同步
          </button>
        </div>
      </div>

      <!-- Supabase Config -->
      <div class="space-y-2.5 text-xs">
        <div class="text-xs font-bold text-ink-900">云端连接配置（后台自动同步）</div>
        <div>
          <label class="block text-[11px] font-semibold text-ink-700 mb-1">Supabase Project URL</label>
          <input
            id="sbUrlInput"
            type="url"
            placeholder="https://xxxx.supabase.co"
            class="w-full bg-ivory border border-linen rounded-xl px-3 py-2 text-xs text-ink-900"
          />
        </div>
        <div>
          <label class="block text-[11px] font-semibold text-ink-700 mb-1">Supabase Anon Key</label>
          <input
            id="sbAnonKeyInput"
            type="password"
            placeholder="eyJ..."
            class="w-full bg-ivory border border-linen rounded-xl px-3 py-2 text-xs text-ink-900"
          />
        </div>
        <div class="flex flex-wrap items-center justify-between gap-2 pt-1">
          <button type="button" onclick="saveSupabaseConfig()" class="px-3 py-1.5 rounded-xl bg-ink-900 text-white font-semibold">
            保存配置
          </button>
          <span id="cloudAccountLabel" class="text-ink-500">未登录云端账号</span>
        </div>
      </div>

      <!-- Persistent Auth Controls -->
      <div id="cloudAuthForm" class="pt-3 border-t border-linen space-y-2 text-xs">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
          <input id="sbEmailInput" type="email" placeholder="邮箱" class="bg-ivory border border-linen rounded-xl px-3 py-2 text-xs" />
          <input id="sbPasswordInput" type="password" placeholder="密码（至少6位）" class="bg-ivory border border-linen rounded-xl px-3 py-2 text-xs" />
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <button type="button" onclick="signInCloudUser()" class="px-3.5 py-1.5 rounded-xl bg-sage text-white font-semibold">登录</button>
          <button type="button" onclick="signUpCloudUser()" class="px-3.5 py-1.5 rounded-xl bg-white border border-linen text-ink-900 font-semibold">注册</button>
          <button type="button" onclick="signOutCloudUser()" class="px-3.5 py-1.5 rounded-xl bg-ivory border border-linen text-ink-700 font-semibold">退出</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Workspace -->
  <main id="mainContainer" class="flex-1 max-w-7xl w-full mx-auto px-3.5 sm:px-6 py-4 sm:py-6 space-y-5 sm:space-y-6"></main>

  <!-- Footer -->
  <footer class="max-w-7xl w-full mx-auto px-3.5 sm:px-6 py-4 sm:py-5 border-t border-linen text-xs text-ink-500 flex flex-wrap items-center justify-between gap-2">
    <span>本地自动保存 · 云端自动同步 · JSON 备份恢复</span>
    <span id="archiveStatsText">已归档：0 天</span>
  </footer>

    function getLocalTodayIso() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    function getCurrentMonthYm(isoDate) {
      return String(isoDate || getLocalTodayIso()).slice(0, 7);

        readingList: [
          { id: 'bk_1', title: '《原子习惯》', completed: false, actionProject: '将固定习惯与晚间流程绑定', actionDone: false },
        ],
        monthlyTasks,
        shoppingList: [
          { id: 'sp_1', name: '密封保鲜盒', category: '日用/家居', priority: '中', note: '', bought: false },
        ],
        days,
        entries: {},
      };
    }

    function normalizeDayEntry(rawEntry, dateStr) {
      const base = createEmptyDayEntry(dateStr || DEFAULT_TODAY);
      if (!rawEntry || typeof rawEntry !== 'object') return base;
      const rawHealth = rawEntry.health && typeof rawEntry.health === 'object' ? rawEntry.health : {};
      const rawChecklist = rawHealth.checklist && typeof rawHealth.checklist === 'object' ? rawHealth.checklist : {};
      const rawExercise = rawEntry.exercise && typeof rawEntry.exercise === 'object' ? rawEntry.exercise : {};
      const rawEnglish = rawEntry.english && typeof rawEntry.english === 'object' ? rawEntry.english : {};
      const rawJournal = rawEntry.journal && typeof rawEntry.journal === 'object' ? rawEntry.journal : {};
      const rawStatus = rawEntry.status && typeof rawEntry.status === 'object' ? rawEntry.status : {};

      return {
        ...base,
        ...rawEntry,
        date: rawEntry.date || dateStr || DEFAULT_TODAY,
        status: { ...base.status, ...rawStatus },
        weightKg: rawEntry.weightKg ?? '',
        isPeriodDay: !!rawEntry.isPeriodDay,
        health: {
          ...base.health,
          ...rawHealth,
          checklist: { ...base.health.checklist, ...rawChecklist },
          boredScrolling: rawHealth.boredScrolling === true ? true : rawHealth.boredScrolling === false ? false : null,
          boredScrollingNote: String(rawHealth.boredScrollingNote || ''),
          essentialOilMassage:
            rawHealth.essentialOilMassage === true ? true : rawHealth.essentialOilMassage === false ? false : null,
          essentialOilMassageNote: String(rawHealth.essentialOilMassageNote || ''),
          supplementsTaken:
            rawHealth.supplementsTaken && typeof rawHealth.supplementsTaken === 'object'
              ? { ...rawHealth.supplementsTaken }
              : {},
          meditationSessions: Number(rawHealth.meditationSessions) || 0,
          meditationMinutes: Number(rawHealth.meditationMinutes) || 0,
          meditationNote: String(rawHealth.meditationNote || ''),
        },
        exercise: { ...base.exercise, ...rawExercise },
        english: { ...base.english, ...rawEnglish },
        journal: { ...base.journal, ...rawJournal },
      };
    }

    function normalizeLoadedState(parsed) {
      const base = createSeededState();
      if (!parsed || typeof parsed !== 'object') return base;

      const merged = {
        ...base,
        ...parsed,
        meta: { ...base.meta, ...(parsed.meta || {}) },
        cycle: { ...base.cycle, ...(parsed.cycle || {}) },
        supplements: Array.isArray(parsed.supplements) ? parsed.supplements : base.supplements,
        giEpisodes: Array.isArray(parsed.giEpisodes) ? parsed.giEpisodes : base.giEpisodes,
        weeklySchedule:
          Array.isArray(parsed.weeklySchedule) && parsed.weeklySchedule.length === 7
            ? parsed.weeklySchedule
            : base.weeklySchedule,
        careerGoals: Array.isArray(parsed.careerGoals) ? parsed.careerGoals : base.careerGoals,
        englishBank: Array.isArray(parsed.englishBank) ? parsed.englishBank : base.englishBank,
        houseTasks: Array.isArray(parsed.houseTasks) ? parsed.houseTasks : base.houseTasks,
        pantryItems: Array.isArray(parsed.pantryItems) ? parsed.pantryItems : base.pantryItems,
        childReportCards:
          parsed.childReportCards && Array.isArray(parsed.childReportCards.subjects)
            ? {
                terms: Array.isArray(parsed.childReportCards.terms) && parsed.childReportCards.terms.length
                  ? parsed.childReportCards.terms
                  : base.childReportCards.terms,
                subjects: parsed.childReportCards.subjects,
              }
            : base.childReportCards,
        readingList: Array.isArray(parsed.readingList) ? parsed.readingList : base.readingList,
        monthlyTasks:
          parsed.monthlyTasks && typeof parsed.monthlyTasks === 'object'
            ? parsed.monthlyTasks
            : base.monthlyTasks,
        days: {},
        entries: parsed.entries && typeof parsed.entries === 'object' ? { ...parsed.entries } : {},
      };

      if (parsed.days && typeof parsed.days === 'object') {
        Object.keys(parsed.days).forEach((dKey) => {
          merged.days[dKey] = normalizeDayEntry(parsed.days[dKey], dKey);
        });
      }

      if (Array.isArray(parsed.shoppingList)) {
        merged.shoppingList = parsed.shoppingList;
      } else if (parsed.shoppingList && typeof parsed.shoppingList === 'object') {
        merged.shoppingList = Object.values(parsed.shoppingList).filter((x) => x && typeof x === 'object');
      } else {
        merged.shoppingList = base.shoppingList;
      }

      const validIds = new Set(SECTIONS.map((s) => s.id));
      if (!validIds.has(merged.meta.activeSection)) {
        merged.meta.activeSection = 'home';
      }

      return merged;
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          return normalizeLoadedState(JSON.parse(raw));
        }
        for (const oldKey of LEGACY_STORAGE_KEYS) {
          const oldRaw = localStorage.getItem(oldKey);
          if (oldRaw) {
            return normalizeLoadedState(JSON.parse(oldRaw));
          }
        }
      } catch (e) {
        console.error('Failed to load state:', e);
      }
      return createSeededState();
    }

    let state = loadState();
    let firedHouseReminders = {};
    let supabaseClient = null;
    let currentCloudUser = null;
    let cloudSyncTimer = null;
    let isApplyingCloudSnapshot = false;

    function getCurrentDayEntry() {
      const selDate = state.meta.selectedDate || DEFAULT_TODAY;
      if (!state.days || typeof state.days !== 'object') {
        state.days = {};
      }
      if (!state.days[selDate]) {
        state.days[selDate] = createEmptyDayEntry(selDate);
      } else {
        state.days[selDate] = normalizeDayEntry(state.days[selDate], selDate);
      }
      return state.days[selDate];
    }

    function getSelectedYearStr() {
      if (state && state.meta && state.meta.selectedMonthlyYear) {
        const y = String(state.meta.selectedMonthlyYear).replace(/[^0-9]/g, '').slice(0, 4);
        if (y.length === 4) return y;
      }
      const baseMonth = (state && state.meta && state.meta.selectedMonth) || getCurrentMonthYm(DEFAULT_TODAY);
      const y2 = String(baseMonth).replace(/[^0-9]/g, '').slice(0, 4);
      return y2.length === 4 ? y2 : String(new Date().getFullYear());
    }

    function getJournalYearStr() {
      if (state && state.meta && state.meta.selectedJournalYear) {
        const y = String(state.meta.selectedJournalYear).replace(/[^0-9]/g, '').slice(0, 4);
        if (y.length === 4) return y;
      }
      const dStr = (state && state.meta && state.meta.selectedDate) || DEFAULT_TODAY;
      const y2 = String(dStr).replace(/[^0-9]/g, '').slice(0, 4);
      return y2.length === 4 ? y2 : String(new Date().getFullYear());
    }

    function getMonthListForYm(ym) {
      if (!state.monthlyTasks || typeof state.monthlyTasks !== 'object') {
        state.monthlyTasks = {};
      }
      if (!Array.isArray(state.monthlyTasks[ym])) {
        state.monthlyTasks[ym] = [];
      }
      return state.monthlyTasks[ym];
    }

    function getNextMonthYm(ym) {
      const parts = String(ym || '').split('-').map(Number);
      if (parts.length !== 2 || !parts[0] || !parts[1]) return getCurrentMonthYm();
      const d = new Date(parts[0], parts[1], 1);
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
    }

    async function initSupabaseClient(autoPull = true) {
      const cfg = loadSupabaseConfig();
      const urlEl = document.getElementById('sbUrlInput');
      const keyEl = document.getElementById('sbAnonKeyInput');
      if (urlEl) urlEl.value = cfg.url;
      if (keyEl) keyEl.value = cfg.anonKey;

      if (!cfg.url || !cfg.anonKey || !window.supabase || typeof window.supabase.createClient !== 'function') {
        supabaseClient = null;
        currentCloudUser = null;
        updateCloudUiStatus('本地模式', 'neutral');
        return;
      }

      try {
        supabaseClient = window.supabase.createClient(cfg.url, cfg.anonKey, {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true,
          },
        });
        const { data } = await supabaseClient.auth.getSession();
        currentCloudUser = (data && data.session && data.session.user) || null;
        if (currentCloudUser) {
          updateCloudUiStatus('自动同步中', 'ok');
          if (autoPull) await pullStateFromCloud(false);
        } else {
          updateCloudUiStatus('本地已存', 'neutral');
        }

        supabaseClient.auth.onAuthStateChange(async (event, session) => {
          const prevUserId = currentCloudUser ? currentCloudUser.id : null;
          currentCloudUser = (session && session.user) || null;
          if (currentCloudUser) {
            updateCloudUiStatus('自动同步中', 'ok');
            if (event === 'SIGNED_IN' || event === 'INITIAL_SESSION' || currentCloudUser.id !== prevUserId) {
              await pullStateFromCloud(false);
            }
          } else {
            updateCloudUiStatus('本地已存', 'neutral');
          }
        });
      } catch (e) {
        console.error('Supabase init error:', e);
        updateCloudUiStatus('连接异常', 'warn');
      }
    }

    async function signInCloudUser() {
      if (!supabaseClient) {

        showToast('登录失败', error.message || '请检查邮箱或密码', '⚠️');

    function scheduleCloudSync() {
      if (!supabaseClient || !currentCloudUser) return;
      clearTimeout(cloudSyncTimer);
      cloudSyncTimer = setTimeout(() => {
        syncStateToCloud(false);
      }, 1200);
    }

    async function syncStateToCloud(notify = false) {
      if (!supabaseClient || !currentCloudUser) {
        if (notify) showToast('未连接云端', '请在设置中配置并登录 Supabase 账号', '⚠️');
        return;
      }
      if (typeof navigator !== 'undefined' && navigator.onLine === false) {
        updateCloudUiStatus('离线待同步', 'neutral');
        return;
      }
      try {
        const nowIso = new Date().toISOString();
        state.updatedAt = nowIso;
        const { error } = await supabaseClient
          .from('user_journal_states')
          .upsert(
            {
              user_id: currentCloudUser.id,
              state_json: state,
              updated_at: nowIso,
            },
            { onConflict: 'user_id' }
          );
        if (error) throw error;
        updateCloudUiStatus('已自动同步', 'ok');
        if (notify) showToast('已同步云端', '最新记录已保存到云端', '☁️');
      } catch (e) {
        console.error('Cloud upsert error:', e);
        updateCloudUiStatus('同步待重试', 'warn');
        if (notify) showToast('同步失败', e.message || '请检查网络连接与 RLS', '⚠️');
      }
    }

    async function pullStateFromCloud(notify = false) {
      if (!supabaseClient || !currentCloudUser) {
        if (notify) showToast('未连接云端', '请在设置中配置并登录 Supabase 账号', '⚠️');
        return;
      }
      if (typeof navigator !== 'undefined' && navigator.onLine === false) {
        updateCloudUiStatus('离线待同步', 'neutral');
        return;
      }
      try {
        const { data, error } = await supabaseClient
          .from('user_journal_states')
          .select('state_json, updated_at')
          .eq('user_id', currentCloudUser.id)
          .maybeSingle();
        if (error) throw error;
        if (data && data.state_json && typeof data.state_json === 'object') {
          const cloudUpdated = Date.parse(data.updated_at || (data.state_json && data.state_json.updatedAt) || 0) || 0;
          const localUpdated = Date.parse(state.updatedAt || 0) || 0;

          if (!localUpdated || cloudUpdated >= localUpdated) {
            isApplyingCloudSnapshot = true;
            state = normalizeLoadedState(data.state_json);
            if (data.updated_at) state.updatedAt = data.updated_at;
            try {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (e) {}
            renderAll();
            isApplyingCloudSnapshot = false;
          } else if (localUpdated > cloudUpdated) {
            await syncStateToCloud(false);
          }
          updateCloudUiStatus('已自动同步', 'ok');
          if (notify) showToast('已拉取云端数据', '视图已更新为最新记录', '☁️');
        } else {
          await syncStateToCloud(false);
        }
      } catch (e) {
        isApplyingCloudSnapshot = false;
        console.error('Cloud pull error:', e);
        updateCloudUiStatus('拉取待重试', 'warn');
        if (notify) showToast('拉取失败', e.message || '请检查网络连接与 RLS', '⚠️');
      }
    }

    // =========================================================================
    // 3. Date, Health, Habit Check-in, Report Card & Journal Helpers
    // =========================================================================
    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function parseIsoDate(iso) {
      const [y, m, d] = String(iso || DEFAULT_TODAY).split('-').map(Number);
      return new Date(y || 2026, (m || 1) - 1, d || 1);
    }

    function formatIsoDate(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function addDaysIso(iso, deltaDays) {
      const d = parseIsoDate(iso);
      d.setDate(d.getDate() + deltaDays);
      return formatIsoDate(d);
    }

    function diffDaysIso(fromIso, toIso) {
      const a = parseIsoDate(fromIso);
      const b = parseIsoDate(toIso);
      return Math.round((b - a) / (1000 * 60 * 60 * 24));
    }

    function getWeekdayCn(iso) {
      return WEEKDAY_NAMES_CN[parseIsoDate(iso).getDay()];
    }

    function getPreviousWeightInfo(currentDateStr) {
      const daysObj = state.days || {};
      const sortedDates = Object.keys(daysObj)
        .filter((d) => d < currentDateStr && daysObj[d] && String(daysObj[d].weightKg || '').trim() !== '')
        .sort();
      if (sortedDates.length === 0) return null;
      const lastDate = sortedDates[sortedDates.length - 1];
      const val = parseFloat(daysObj[lastDate].weightKg);
      if (Number.isNaN(val)) return null;
      return { date: lastDate, weight: val };
    }

    function computeCycleInsights(selectedDateStr) {
      const cycleLen = Math.max(20, Math.min(45, Number(state.cycle.cycleLength) || 28));
      const lastStart = (state.cycle.lastPeriodStart || '').trim();
      if (!lastStart) {
        return {
          hasStart: false,
          cycleLen,
          lastStart: '',
          dayInCycle: null,
          nextPeriodDate: '',
          daysUntilNext: null,
          phaseLabel: '未设起始日',
          phaseTip: '点击「设为周期起点」或填写上次开始日期后自动推算。',
          badgeTone: 'bg-linen text-ink-700',
        };
      }

      const dayInCycle = diffDaysIso(lastStart, selectedDateStr) + 1;
      const nextPeriodDate = addDaysIso(lastStart, cycleLen);
      const daysUntilNext = diffDaysIso(selectedDateStr, nextPeriodDate);

      let phaseLabel = '卵泡期';
      let phaseTip = '精力较平稳，可按计划安排日常。';
      let badgeTone = 'bg-sage/15 text-sage';

      if (dayInCycle >= 1 && dayInCycle <= 5) {
        phaseLabel = '经期';
        phaseTip = '注意保暖与适度休息。';
        badgeTone = 'bg-terracotta/15 text-terracotta';
      } else if (dayInCycle >= cycleLen - 15 && dayInCycle <= cycleLen - 12) {
        phaseLabel = '排卵期前后';
        phaseTip = '注意补水与营养均衡。';
        badgeTone = 'bg-slateblue/15 text-slateblue';
      } else if (dayInCycle > cycleLen - 12 && dayInCycle <= cycleLen) {
        phaseLabel = '黄体期';
        phaseTip = '饮食宜清淡温热，注意作息。';
        badgeTone = 'bg-amberwarm/15 text-amberwarm';
      } else if (dayInCycle > cycleLen) {
        phaseLabel = '已过预计经期';
        phaseTip = `超出周期 ${dayInCycle - cycleLen} 天；如已来可点「设为周期起点」。`;
        badgeTone = 'bg-terracotta/15 text-terracotta';
      }

      return {
        hasStart: true,
        cycleLen,
        lastStart,
        dayInCycle,
        nextPeriodDate,
        daysUntilNext,
        phaseLabel,
        phaseTip,
        badgeTone,
      };
    }

    function computeGiStats(selectedDateStr) {
      const episodes = [...(state.giEpisodes || [])].sort((a, b) => a.date.localeCompare(b.date));
      if (episodes.length === 0) {
        return { daysSinceLast: null, countLast30: 0 };
      }
      const pastOrToday = episodes.filter((e) => e.date <= selectedDateStr);
      const latest = pastOrToday.length > 0 ? pastOrToday[pastOrToday.length - 1] : episodes[episodes.length - 1];
      const daysSinceLast = diffDaysIso(latest.date, selectedDateStr);
      const cutoff30 = addDaysIso(selectedDateStr, -30);
      const countLast30 = episodes.filter((e) => e.date >= cutoff30 && e.date <= selectedDateStr).length;
      return { daysSinceLast, countLast30 };
    }

    function computeMeditationStats(selectedDateStr) {
      const entry = getCurrentDayEntry();
      const todaySessions = Number(entry.health.meditationSessions) || 0;
      const todayMinutes = Number(entry.health.meditationMinutes) || 0;
      const cutoff7 = addDaysIso(selectedDateStr, -6);
      let weekSessions = 0;
      let weekMinutes = 0;
      Object.keys(state.days || {}).forEach((d) => {
        if (d >= cutoff7 && d <= selectedDateStr) {
          const h = (state.days[d] && state.days[d].health) || {};
          weekSessions += Number(h.meditationSessions) || 0;
          weekMinutes += Number(h.meditationMinutes) || 0;
        }
      });
      return { todaySessions, todayMinutes, weekSessions, weekMinutes };
    }

    // Rolling 7-day & 30-day "是" counts for boredScrolling / essentialOilMassage
    function computeDailyHabitCheckinStats(fieldKey, selectedDateStr) {
      const cutoff7 = addDaysIso(selectedDateStr, -6);
      const cutoff30 = addDaysIso(selectedDateStr, -29);
      let yes7 = 0;
      let yes30 = 0;
      const daysObj = state.days || {};
      Object.keys(daysObj).forEach((d) => {
        if (d <= selectedDateStr) {
          const h = (daysObj[d] && daysObj[d].health) || {};
          if (h[fieldKey] === true) {
            if (d >= cutoff30) yes30 += 1;
            if (d >= cutoff7) yes7 += 1;
          }
        }
      });
      return { yes7, yes30 };
    }

      if (daysLeft < 0) {

      if (daysLeft <= 7) {

      const byCat = (cat) => sorted.filter((i) => i.category === cat);

      const protein = byCat('蛋白肉蛋');

      const spices = byCat('调味料');

      const recipes = [];

      if (soy.length > 0 || veggies.length > 0 || protein.length > 0) {
        const mainA = soy[0] || protein[0] || veggies[0];
        const mainB = veggies[0] && veggies[0].id !== mainA.id ? veggies[0] : dried[0] || soy[1];
        const sp = spices[0];
        const used = [mainA, mainB, sp].filter(Boolean).map((x) => `${x.name}（${x.category}）`);
        recipes.push({
          title: `${mainA.name.split('/')[0].trim()} + ${mainB ? mainB.name.split('/')[0].trim() : '时蔬'}家常搭配`,
          tag: '优先临期 · 营养均衡',
          usedItems: used,
          steps: `结合现有${mainA.name}${mainB ? `与${mainB.name}` : ''}，使用${sp ? sp.name : '基础调味料'}少油快炒或炖煮。`,
        });
      }

      if (staples.length > 0 || dried.length > 0) {
        const s1 = staples[0] || dried[0];
        const s2 = dried[0] || soy[0] || veggies[0];
        const sp = spices[0];
        const used = [s1, s2, sp].filter(Boolean).map((x) => `${x.name}（${x.category}）`);
        recipes.push({
          title: `${s1 ? s1.name.split('/')[0].trim() : '主食'}与${s2 ? s2.name.split('/')[0].trim() : '配菜'}温热组合`,
          tag: '主食配菜建议',
          usedItems: used,
          steps: `搭配${s1 ? s1.name : '主食'}与${s2 ? s2.name : '配菜'}，辅以${sp ? sp.name : '清淡调味'}做成温热餐食。`,
        });
      }

      const seed = Number(state.meta.pantryRecipeSeed) || 0;
      if (recipes.length > 1 && seed > 0) {
        const offset = seed % recipes.length;
        return [...recipes.slice(offset), ...recipes.slice(0, offset)];
      }
      return recipes;
    }

    function parseGradeNumeric(gradeStr) {
      const raw = String(gradeStr || '').trim();
      if (!raw) return null;
      const upper = raw.toUpperCase();
      if (Object.prototype.hasOwnProperty.call(GRADE_RANK_MAP, upper)) {
        return GRADE_RANK_MAP[upper];
      }
      const slashMatch = upper.match(/^(-?\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)$/);
      if (slashMatch) {
        const num = parseFloat(slashMatch[1]);
        const den = parseFloat(slashMatch[2]);
        if (!Number.isNaN(num) && !Number.isNaN(den) && den !== 0) {
          return (num / den) * 100;
        }
      }
      const numMatch = upper.match(/-?\d+(?:\.\d+)?/);
      if (numMatch) {
        const num = parseFloat(numMatch[0]);
        return Number.isNaN(num) ? null : num;
      }
      return null;
    }

    // Backward-compatible extractor for both legacy `grades` and `metrics.{term}.{achievement,effort}`
    function normalizeSubjectTermScore(sub, termName) {
      const legacyGrade = (sub && sub.grades && sub.grades[termName]) || '';
      const rawMetric = sub && sub.metrics && sub.metrics[termName];
      if (rawMetric && typeof rawMetric === 'object') {
        const achievement = String(rawMetric.achievement ?? legacyGrade ?? '').trim();
        const effort = String(rawMetric.effort ?? '').trim();
        return { achievement, effort };
      }
      if (typeof rawMetric === 'string' && rawMetric.trim()) {
        return { achievement: rawMetric.trim(), effort: '' };
      }
      return { achievement: String(legacyGrade || '').trim(), effort: '' };
    }

    function evaluateSingleDimensionDiff(scoreA, scoreB, termB, dimLabel) {
      const cleanA = String(scoreA || '').trim();
      const cleanB = String(scoreB || '').trim();
      const numA = parseGradeNumeric(cleanA);
      const numB = parseGradeNumeric(cleanB);

      if (numA !== null && numB !== null) {
        const diff = numB - numA;
        if (diff > 0) {
          return {
            status: 'improved',
            label: `${dimLabel} ↑ 进步 (${cleanA} → ${cleanB})`,
            badgeClass: 'bg-sage/15 text-sage font-bold',
          };
        }
        if (diff === 0) {
          return {
            status: 'steady',
            label: `${dimLabel} → 持平 (${cleanB})`,
            badgeClass: 'bg-slateblue/15 text-slateblue font-semibold',
          };
        }
        return {
          status: 'attention',
          label: `${dimLabel} ↓ 需关注 (${cleanA} → ${cleanB})`,
          badgeClass: 'bg-terracotta/15 text-terracotta font-semibold',
        };
      }

      if (cleanA && cleanB) {
        if (cleanA === cleanB) {
          return {
            status: 'steady',
            label: `${dimLabel} → 持平 (${cleanB})`,
            badgeClass: 'bg-slateblue/15 text-slateblue font-semibold',
          };
        }
        return {
          status: 'changed',
          label: `${dimLabel} 变更 (${cleanA} → ${cleanB})`,
          badgeClass: 'bg-amberwarm/15 text-amberwarm font-semibold',
        };
      }

      if (cleanB) {
        return {
          status: 'pending',
          label: `${dimLabel} (${termB}): ${cleanB}`,
          badgeClass: 'bg-linen text-ink-700',
        };
      }

      return {
        status: 'pending',
        label: `${dimLabel}: 待录入`,
        badgeClass: 'bg-linen text-ink-500',
      };
    }

    function computeReportCardComparison(termA, termB) {
      const rc = state.childReportCards || { terms: [], subjects: [] };
      const rows = (rc.subjects || []).map((sub) => {
        const pairA = normalizeSubjectTermScore(sub, termA);
        const pairB = normalizeSubjectTermScore(sub, termB);

        const achievementComp = evaluateSingleDimensionDiff(
          pairA.achievement,
          pairB.achievement,
          termB,
          'Achievement'
        );
        const effortComp = evaluateSingleDimensionDiff(
          pairA.effort,
          pairB.effort,
          termB,
          'Effort'
        );

        let overallStatus = 'pending';
        if (achievementComp.status === 'improved' || effortComp.status === 'improved') {
          overallStatus = 'improved';
        } else if (achievementComp.status === 'attention' || effortComp.status === 'attention') {
          overallStatus = 'attention';
        } else if (achievementComp.status === 'steady' || effortComp.status === 'steady') {
          overallStatus = 'steady';
        }

        return {
          ...sub,
          achA: pairA.achievement,
          effA: pairA.effort,
          achB: pairB.achievement,
          effB: pairB.effort,
          achievementComp,
          effortComp,
          overallStatus,
        };
      });

      return {
        rows,
        improvedAchievement: rows.filter((r) => r.achievementComp.status === 'improved'),
        improvedEffort: rows.filter((r) => r.effortComp.status === 'improved'),
        attentionItems: rows.filter(
          (r) => r.achievementComp.status === 'attention' || r.effortComp.status === 'attention'
        ),
      };
    }

    // Reads journal data from state.days[dateStr].journal with fallback to state.entries[dateStr]
    function getCombinedJournalSourceForDate(dateStr) {
      const dayObj = (state.days && state.days[dateStr] && state.days[dateStr].journal) || null;
      const altObj =
        state.entries && typeof state.entries === 'object' && state.entries[dateStr]
          ? state.entries[dateStr].journal || state.entries[dateStr]
          : null;

      const mood = String((dayObj && dayObj.mood) || (altObj && altObj.mood) || '').trim();
      const gratitude = String((dayObj && dayObj.gratitude) || (altObj && altObj.gratitude) || '').trim();
      const freeText = String(
        (dayObj && dayObj.freeText) ||
          (altObj && (altObj.freeText || altObj.text || altObj.content)) ||
          ''
      ).trim();

      const combinedText = [gratitude, freeText].filter(Boolean).join(' · ');
      const hasContent = !!(combinedText || (mood && mood !== '平和'));
      return {
        date: dateStr,
        mood,
        gratitude,
        freeText,
        combinedText,
        hasContent,
      };
    }

    function playGentleChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        [523.25, 659.25, 783.99].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.15);
          gain.gain.setValueAtTime(0.06, ctx.currentTime + idx * 0.15);
          gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + idx * 0.15 + 0.55);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.15);
          osc.stop(ctx.currentTime + idx * 0.15 + 0.6);
        });
      } catch (e) {}
    }

    function updateChildSubjectGrade(subId, termName, val, dimension = 'achievement') {
      const sub = state.childReportCards.subjects.find((s) => s.id === subId);
      if (sub) {
        const cleanVal = String(val || '').trim();
        const existing = normalizeSubjectTermScore(sub, termName);
        if (!sub.metrics || typeof sub.metrics !== 'object') {
          sub.metrics = {};
        }
        const nextMetric = {
          achievement: dimension === 'achievement' ? cleanVal : existing.achievement,
          effort: dimension === 'effort' ? cleanVal : existing.effort,
        };
        sub.metrics[termName] = nextMetric;

        if (!sub.grades || typeof sub.grades !== 'object') {
          sub.grades = {};
        }
        if (dimension === 'achievement') {
          sub.grades[termName] = cleanVal;
        } else if (!sub.grades[termName] && nextMetric.achievement) {
          sub.grades[termName] = nextMetric.achievement;
        }
        saveState();
        renderMain();
      }
    }

    function exportBackupJson() {
      try {
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `life_journal_backup_${getLocalTodayIso()}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('备份已导出', '已下载完整 JSON 备份文件', '💾');
      } catch (e) {
        showToast('导出失败', '请检查浏览器下载权限', '⚠️');
      }
    }

    function importBackupJson(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!parsed || typeof parsed !== 'object') {
            throw new Error('Invalid JSON');
          }
          state = normalizeLoadedState(parsed);
          saveState();
          renderAll();
          showToast('恢复成功', '已导入备份数据', '✅');
        } catch (err) {
          showToast('导入失败', '请选择有效的 JSON 备份文件', '⚠️');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    // 每月待办 (Year selector YYYY + 12-month simultaneous grid YYYY-01 ~ YYYY-12)
    function renderMonthlyCard(isDetailed = false) {
      const selectedYear = getSelectedYearStr();
      const activeMonth = state.meta.selectedMonth || DEFAULT_MONTH;
      const filterCat = state.meta.monthlyFilterCategory || '全部';
      const monthNames = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];

      const yearMonths = monthNames.map((label, idx) => {
        const mm = String(idx + 1).padStart(2, '0');
        const ym = `${selectedYear}-${mm}`;
        const rawList = getMonthListForYm(ym);
        const filteredList = filterCat === '全部' ? rawList : rawList.filter((m) => m.category === filterCat);
        const totalCount = rawList.length;
        const doneCount = rawList.filter((m) => m.completed).length;
        return { ym, mm, label, rawList, filteredList, totalCount, doneCount };
      });

    // 日记 + 全年记录 (12-month full-year overview visible on one screen)
    function renderJournalCard(entry, isDetailed = false) {
      const selDate = state.meta.selectedDate || DEFAULT_TODAY;
      const journalYear = getJournalYearStr();
      const yearNum = parseInt(journalYear, 10) || new Date().getFullYear();
      const yearFilter = state.meta.journalYearFilter === 'written' ? 'written' : 'all';
      const monthLabels = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];

      let yearWrittenDays = 0;
      const monthsHtml = monthLabels.map((mLabel, mIdx) => {
        const mm = String(mIdx + 1).padStart(2, '0');
        const daysCount = getDaysInMonthIso(yearNum, mIdx);
        const dayItems = [];
        for (let d = 1; d <= daysCount; d += 1) {
          const dd = String(d).padStart(2, '0');
          const iso = `${journalYear}-${mm}-${dd}`;
          const info = getCombinedJournalSourceForDate(iso);
          if (info.hasContent) yearWrittenDays += 1;
          dayItems.push({ dayNum: d, iso, info });
        }

        const monthWrittenCount = dayItems.filter((x) => x.info.hasContent).length;
        const visibleDays =
          yearFilter === 'written' ? dayItems.filter((x) => x.info.hasContent) : dayItems;
        const writtenSnippets = dayItems.filter((x) => x.info.hasContent).slice(0, 2);

        return `
          <section class="rounded-2xl bg-ivory border border-linen p-2.5 sm:p-3 space-y-2">
            <div class="flex items-center justify-between pb-1 border-b border-linen text-xs">
              <span class="font-bold text-ink-900">
                ${escapeHtml(mLabel)}
                <span class="text-[11px] font-normal text-ink-500">${escapeHtml(journalYear)}-${mm}</span>
              </span>
              <span class="px-2 py-0.5 rounded-full text-[11px] font-semibold ${
                monthWrittenCount > 0 ? 'bg-sage/15 text-sage' : 'bg-white text-ink-500 border border-linen'
              }">
                ${monthWrittenCount}/${daysCount}
              </span>
            </div>

            <div class="flex flex-wrap gap-1 max-h-36 overflow-y-auto pr-0.5">
              ${
                visibleDays.length === 0
                  ? `<div class="w-full text-[11px] text-ink-500 py-2 text-center bg-white/70 rounded-xl border border-dashed border-linen">暂无已写</div>`
                  : visibleDays.map(({ dayNum, iso, info }) => {
                      const isSelected = iso === selDate;
                      const tipText = info.hasContent
                        ? `${iso}${info.mood ? ` [${info.mood}]` : ''}: ${info.combinedText || '已写'}`
                        : `${iso} 未写`;
                      return `
                        <button
                          type="button"
                          title="${escapeHtml(tipText)}"
                          onclick="setSelectedDate('${iso}')"
                          class="px-2 py-1 rounded-lg border text-[11px] font-semibold transition ${
                            isSelected
                              ? 'bg-slateblue text-white border-slateblue'
                              : info.hasContent
                              ? 'bg-sage/15 text-sage border-sage/40 hover:bg-sage/25'
                              : 'bg-white text-ink-500 border-linen hover:bg-linen/60'
                          }"
                        >
                          ${dayNum}
                        </button>
                      `;
                    }).join('')
              }
            </div>

            ${
              writtenSnippets.length > 0
                ? `<div class="space-y-1 pt-1 border-t border-linen/80 text-[11px]">
                    ${writtenSnippets.map((w) => `
                      <button
                        type="button"
                        onclick="setSelectedDate('${w.iso}')"
                        class="w-full text-left px-2 py-1 rounded-lg bg-white border border-linen text-ink-700 hover:border-sage truncate block"
                      >
                        <span class="font-bold text-sage">${w.dayNum}号</span>
                        <span>${escapeHtml(w.info.combinedText || w.info.mood || '已写')}</span>
                      </button>
                    `).join('')}
                  </div>`
                : ''
            }
          </section>
        `;
      }).join('');

      return `
        <section class="bg-white rounded-3xl p-4 sm:p-5 border border-linen shadow-card space-y-4 sm:space-y-5">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <h3 class="font-editorial text-base font-bold text-ink-900">📖 日记 (${escapeHtml(selDate)})</h3>
            <div class="flex items-center gap-2 text-xs">
              <span class="text-ink-500">心情</span>
              <input
                type="text"
                value="${escapeHtml(entry.journal.mood || '')}"
                onchange="updateJournalField('mood', this.value)"
                class="w-28 bg-ivory border border-linen rounded-xl px-2.5 py-1.5 font-semibold"
              />
              ${
                isDetailed
                  ? `<button type="button" onclick="jumpToSection('home')" class="text-xs font-semibold text-slateblue hover:underline ml-1">← 主页</button>`
                  : `<button type="button" onclick="jumpToSection('diary')" class="text-xs font-semibold text-slateblue hover:underline ml-1">独立视图 →</button>`
              }
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
            <div>
              <label class="block font-semibold text-ink-700 mb-1">随记 / 感恩</label>
              <textarea
                rows="3"
                oninput="updateJournalField('gratitude', this.value)"
                placeholder="写下值得留下的瞬间..."
                class="w-full bg-ivory border border-linen rounded-2xl p-3 text-xs text-ink-900 focus:outline-none focus:border-sage"
              >${escapeHtml(entry.journal.gratitude || '')}</textarea>
            </div>
            <div>
              <label class="block font-semibold text-ink-700 mb-1">正文</label>
              <textarea
                rows="3"
                oninput="updateJournalField('freeText', this.value)"
                placeholder="自由记录..."
                class="w-full bg-ivory border border-linen rounded-2xl p-3 text-xs text-ink-900 focus:outline-none focus:border-sage"
              >${escapeHtml(entry.journal.freeText || '')}</textarea>
            </div>
          </div>

          <!-- 全年记录 (12 Months Full-Year Overview on One Screen) -->
          <div class="pt-4 border-t border-linen space-y-3.5">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div class="flex flex-wrap items-center gap-2">
                <h4 class="text-sm font-bold text-ink-900">🗓️ 全年记录</h4>
                <div class="flex items-center bg-ivory border border-linen rounded-xl p-0.5">
                  <button type="button" onclick="shiftJournalYear(-1)" class="px-2.5 py-1 text-xs font-bold text-ink-700 hover:bg-linen rounded-lg">◀</button>
                  <input
                    type="number"
                    min="2000"
                    max="2099"
                    value="${escapeHtml(journalYear)}"
                    onchange="setSelectedJournalYear(this.value)"
                    class="w-16 bg-transparent text-center text-xs font-bold text-ink-900 focus:outline-none"
                  />
                  <span class="text-xs font-bold text-ink-700 pr-1.5">年</span>
                  <button type="button" onclick="shiftJournalYear(1)" class="px-2.5 py-1 text-xs font-bold text-ink-700 hover:bg-linen rounded-lg">▶</button>
                </div>
                <span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-sage/15 text-sage">
                  ${escapeHtml(journalYear)} 年已写 ${yearWrittenDays} 天
                </span>
              </div>

              <div class="flex items-center gap-1.5 text-xs">
                <button
                  type="button"
                  onclick="setJournalYearFilter('all')"
                  class="px-3 py-1.5 rounded-xl font-semibold ${
                    yearFilter === 'all' ? 'bg-ink-900 text-white' : 'bg-ivory border border-linen text-ink-700'
                  }"
                >
                  全部
                </button>
                <button
                  type="button"
                  onclick="setJournalYearFilter('written')"
                  class="px-3 py-1.5 rounded-xl font-semibold ${
                    yearFilter === 'written' ? 'bg-sage text-white' : 'bg-ivory border border-linen text-ink-700'
                  }"
                >
                  仅已写
                </button>
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-3 sm:gap-3.5">
              ${monthsHtml}
            </div>
          </div>
        </section>
      `;
    }

    function renderMain() {
      const main = document.getElementById('mainContainer');
      if (!main) return;

      try {
        const entry = getCurrentDayEntry();
        const active = state.meta.activeSection || 'home';

        if (active === 'home') {
          main.innerHTML = `
            ${renderHomeTopStrip(entry)}
            ${renderHealthCard(entry, false)}
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
              ${renderCareerCard(false)}
              ${renderEnglishCard(entry, false)}
              ${renderHouseCard(false)}
              ${renderPantryCard(false)}
            </div>
            ${renderChildCard(false)}
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
              ${renderReadingCard(false)}
              ${renderMonthlyCard(false)}
            </div>
            ${renderShoppingCard(false)}
            ${renderJournalCard(entry, false)}
          `;
        } else if (active === 'health') {
          main.innerHTML = `${renderHomeTopStrip(entry)}${renderHealthCard(entry, true)}`;
        } else if (active === 'career') {
          main.innerHTML = renderCareerCard(true);
        } else if (active === 'english') {
          main.innerHTML = renderEnglishCard(entry, true);
        } else if (active === 'house') {
          main.innerHTML = renderHouseCard(true);
        } else if (active === 'pantry') {
          main.innerHTML = renderPantryCard(true);
        } else if (active === 'child') {
          main.innerHTML = renderChildCard(true);
        } else if (active === 'reading') {
          main.innerHTML = renderReadingCard(true);
        } else if (active === 'monthly') {
          main.innerHTML = renderMonthlyCard(true);
        } else if (active === 'diary') {
          main.innerHTML = renderJournalCard(entry, true);
        } else if (active === 'shopping') {
          main.innerHTML = renderShoppingCard(true);
        } else {
          state.meta.activeSection = 'home';
          main.innerHTML = `
            ${renderHomeTopStrip(entry)}
            ${renderHealthCard(entry, false)}
            ${renderJournalCard(entry, false)}
          `;
        }
      } catch (err) {
        console.error('Render error:', err);
        main.innerHTML = `
          <div class="bg-white rounded-3xl p-6 border border-linen shadow-card space-y-3 text-xs">
            <div class="text-sm font-bold text-terracotta">视图渲染遇到异常，已启用安全恢复</div>
            <p class="text-ink-700">${escapeHtml(err && err.message ? err.message : '未知渲染错误')}</p>
            <button type="button" onclick="jumpToSection('home')" class="px-3 py-1.5 rounded-xl bg-sage text-white font-semibold">返回主页</button>
          </div>
        `;
      }
    }

    function updateArchiveFooter() {
      const count = Object.keys(state.days || {}).length;
      const el = document.getElementById('archiveStatsText');
      if (el) el.textContent = `已归档：${count} 天`;
    }

    function renderAll() {
      const picker = document.getElementById('headerDatePicker');
      if (picker) picker.value = state.meta.selectedDate || DEFAULT_TODAY;
      renderNavTabs();
      renderMain();
      updateArchiveFooter();
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderAll();
      initSupabaseClient(true);
      checkHouseWeeklyReminders();
      setInterval(checkHouseWeeklyReminders, 20000);
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && supabaseClient && currentCloudUser) {
        pullStateFromCloud(false);
      }
    });

    window.addEventListener('online', () => {
      if (supabaseClient && currentCloudUser) {
        pullStateFromCloud(false);
      }
    });
  </script>
</body>
</html>
