<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Life Journal Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-ivory: #FAF7F2;
      --card-surface: #FFFCF7;
      --border-sand: #E6DFD3;
      --ink-primary: #2B2623;
      --ink-muted: #786E65;
      --accent-sage: #3F6250;
      --accent-sage-soft: #EBF1ED;
      --accent-rose: #A84A5C;
      --accent-rose-soft: #F9ECEE;
      --accent-amber: #A66E2E;
      --accent-amber-soft: #FBF3E6;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      background-color: var(--bg-ivory);
      color: var(--ink-primary);
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    @media (min-width: 640px) {
      body.mobile-frame-mode {
        background-color: #EAE4DA;
        padding: 20px 0;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        min-height: 100vh;
      }
      body.mobile-frame-mode #app-shell {
        width: 390px;
        min-height: 844px;
        max-height: 844px;
        overflow-y: auto;
        border-radius: 38px;
        border: 8px solid #2B2623;
        box-shadow: 0 24px 60px rgba(43, 38, 35, 0.22);
        background-color: var(--bg-ivory);
      }
    }

    .card {
      background-color: var(--card-surface);
      border: 1px solid var(--border-sand);
      border-radius: 18px;
      box-shadow: 0 1px 3px rgba(43, 38, 35, 0.03);
    }

    .btn-pill {
      transition: all 0.15s ease;
    }
    .btn-pill:active {
      transform: scale(0.96);
    }

    input, select, textarea {
      font-family: inherit;
      color: var(--ink-primary);
      background-color: #FFFFFF;
      border: 1px solid var(--border-sand);
      border-radius: 12px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--accent-sage);
      box-shadow: 0 0 0 2px rgba(63, 98, 80, 0.12);
    }
  </style>
</head>
<body>
  <div id="app-shell" class="w-full max-w-2xl mx-auto min-h-screen flex flex-col justify-between bg-[#FAF7F2]">
    <!-- Top Header + Symbol Navigation -->
    <header class="sticky top-0 z-30 bg-[#FAF7F2]/95 backdrop-blur-sm border-b border-[#E6DFD3] px-3 pt-2.5 pb-2">
      <div class="flex items-center justify-between mb-2 px-1">
        <div class="flex items-center gap-2">
          <span class="text-sm font-semibold tracking-tight text-[#2B2623]" id="header-date-label">2026-11-25</span>
          <span id="sync-status-dot" class="inline-block w-2 h-2 rounded-full bg-[#B5ABA0]" title="Local storage active"></span>
        </div>
        <button
          type="button"
          id="frame-toggle-btn"
          onclick="toggleMobileFrame()"
          class="hidden sm:inline-flex items-center gap-1 text-xs px-2.5 py-1 rounded-full border border-[#E6DFD3] bg-[#FFFCF7] text-[#786E65] hover:text-[#2B2623]"
          title="Toggle 390x844 Mobile Frame Preview"
        >
          📱 Mobile Frame
        </button>
      </div>

      <!-- Symbol-Only Pill Navigation -->
      <nav id="top-nav" class="flex items-center gap-1.5 overflow-x-auto no-scrollbar pb-0.5" aria-label="Primary Navigation"></nav>
    </header>

    <!-- Main Dynamic View Container -->
    <main id="main-content" class="flex-1 px-3.5 py-3.5 space-y-3"></main>

    <!-- Bottom Footer: Achievements + Date Navigation + Utility & Cloud Controls -->
    <footer class="px-3.5 pt-2 pb-5 space-y-2.5 border-t border-[#E6DFD3] bg-[#FAF7F2]">
      <div id="achievements-container"></div>

      <div class="card px-2.5 py-2 flex flex-wrap items-center justify-between gap-1.5">
        <div class="flex items-center gap-1">
          <button type="button" onclick="shiftDate(-2)" class="btn-pill w-8 h-8 rounded-xl bg-[#FAF7F2] border border-[#E6DFD3] flex items-center justify-center text-xs" title="2 Days Ago" aria-label="2 Days Ago">⏪</button>
          <button type="button" onclick="shiftDate(-1)" class="btn-pill w-8 h-8 rounded-xl bg-[#FAF7F2] border border-[#E6DFD3] flex items-center justify-center text-xs" title="Yesterday" aria-label="Yesterday">◀</button>
          <button type="button" onclick="goToday()" class="btn-pill w-8 h-8 rounded-xl bg-[#EBF1ED] border border-[#C7D7CE] text-[#3F6250] flex items-center justify-center text-xs font-bold" title="Today" aria-label="Today">●</button>
          <input
            type="date"
            id="footer-date-picker"
            onchange="setSelectedDate(this.value)"
            class="h-8 px-2 text-xs font-medium bg-[#FAF7F2] border border-[#E6DFD3] rounded-xl"
            aria-label="Select Date"
          />
          <button type="button" onclick="shiftDate(1)" class="btn-pill w-8 h-8 rounded-xl bg-[#FAF7F2] border border-[#E6DFD3] flex items-center justify-center text-xs" title="Tomorrow" aria-label="Tomorrow">▶</button>
          <button type="button" onclick="shiftDate(2)" class="btn-pill w-8 h-8 rounded-xl bg-[#FAF7F2] border border-[#E6DFD3] flex items-center justify-center text-xs" title="Day After Tomorrow" aria-label="Day After Tomorrow">⏩</button>
        </div>

        <div class="flex items-center gap-1">
          <button type="button" onclick="openModal('settings')" class="btn-pill w-8 h-8 rounded-xl bg-[#FAF7F2] border border-[#E6DFD3] flex items-center justify-center text-sm" title="Cycle & Year Settings" aria-label="Cycle and Year Settings">⚙️</button>
          <button type="button" onclick="openModal('cloud')" class="btn-pill w-8 h-8 rounded-xl bg-[#FAF7F2] border border-[#E6DFD3] flex items-center justify-center text-sm" title="Supabase Cloud Sync" aria-label="Supabase Cloud Sync">☁️</button>
          <button type="button" onclick="syncNow()" class="btn-pill w-8 h-8 rounded-xl bg-[#FAF7F2] border border-[#E6DFD3] flex items-center justify-center text-sm" title="Sync Now" aria-label="Sync Now">🔄</button>
          <button type="button" onclick="toggleAutoSync()" id="auto-sync-btn" class="btn-pill w-8 h-8 rounded-xl bg-[#FAF7F2] border border-[#E6DFD3] flex items-center justify-center text-sm" title="Toggle Auto-Sync" aria-label="Toggle Auto-Sync">⏱️</button>
          <button type="button" onclick="exportJSON()" class="btn-pill w-8 h-8 rounded-xl bg-[#FAF7F2] border border-[#E6DFD3] flex items-center justify-center text-sm" title="Export JSON Backup" aria-label="Export JSON Backup">📤</button>
          <label class="btn-pill w-8 h-8 rounded-xl bg-[#FAF7F2] border border-[#E6DFD3] flex items-center justify-center text-sm cursor-pointer" title="Import JSON Backup" aria-label="Import JSON Backup">
            📥
            <input type="file" accept=".json" onchange="importJSON(event)" class="hidden" />
          </label>
          <button type="button" onclick="openResetModal()" class="btn-pill w-8 h-8 rounded-xl bg-[#FAF7F2] border border-[#E6DFD3] flex items-center justify-center text-sm" title="Reset Data" aria-label="Reset Data">♻️</button>
        </div>
      </div>
    </footer>
  </div>

  <!-- Modal Overlay -->
  <div id="modal-backdrop" class="fixed inset-0 z-50 hidden bg-black/40 backdrop-blur-[1px] flex items-end sm:items-center justify-center p-3">
    <div id="modal-box" class="card w-full max-w-md p-4 bg-[#FFFCF7] max-h-[85vh] overflow-y-auto"></div>
  </div>

  <!-- Toast Feedback -->
  <div id="toast" class="fixed top-14 left-1/2 -translate-x-1/2 z-50 hidden px-3.5 py-1.5 rounded-full bg-[#2B2623] text-[#FFFCF7] text-xs font-medium shadow-lg"></div>

  <script>
    const STORAGE_KEY = 'life_journal_hub_complete_v5';
    const LEGACY_KEYS = ['life_journal_hub_complete_v4', 'life_journal_hub_complete_v3', 'life_journal_hub_v2'];

    const NAV_ITEMS = [
      { id: 'home', icon: '🏡', label: 'Home' },
      { id: 'health', icon: '🌿', label: 'Health' },
      { id: 'learning', icon: '💻', label: 'Learning' },
      { id: 'family', icon: '🧹', label: 'Family' },
      { id: 'reading', icon: '📚', label: 'Reading' },
      { id: 'todo', icon: '🗓️', label: 'Monthly Todo' },
      { id: 'diary', icon: '📖', label: 'Diary' },
      { id: 'shopping', icon: '🛒', label: 'Shopping List' }
    ];

    function getLocalTodayStr() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    const DEFAULT_TODAY = getLocalTodayStr();

    function createInitialState() {
      return {
        selectedDate: DEFAULT_TODAY,
        activeTab: 'home',
        mobileFrame: false,
        settings: {
          startDate: DEFAULT_TODAY,
          lastPeriodDate: '2026-11-05',
          cycleLength: 28
        },
        cloud: {
          url: '',
          anonKey: '',
          table: 'life_journal_state',
          recordId: 'default_user',
          autoSync: false,
          lastSynced: ''
        },
        healthLogs: {
          [DEFAULT_TODAY]: {
            exerciseDone: true,
            exerciseNote: '30 min walk + stretching',
            meditationMinutes: 15,
            phoneControl: 'yes',
            massage: false,
            giDiscomfortCount: 0,
            periodStart: false
          }
        },
        learningItems: [
          {
            id: 'learn-1',
            title: 'Web Development & Database Module',
            status: 'in_progress',
            progress: 65,
            notes: 'HTML5, CSS, Supabase sync'
          }
        ],
        familyItems: [
          {
            id: 'fam-1',
            date: DEFAULT_TODAY,
            title: 'Walk Cookie & tidy living room',
            done: false
          }
        ],
        specialCleaning: [
          {
            id: 'clean-1',
            date: DEFAULT_TODAY,
            task: 'Wipe kitchen rangehood & dining sideboard',
            area: 'Kitchen & Dining',
            priority: 'Normal',
            notes: 'Use mild eucalyptus spray',
            done: false
          }
        ],
        readingList: [
          {
            id: 'book-1',
            title: 'Biohack Your Brain',
            author: 'Dr. Kristen Willeumier',
            status: 'reading',
            notes: 'Chapter 3 nutrition & sleep'
          }
        ],
        monthlyTodos: [
          {
            id: 'todo-1',
            month: DEFAULT_TODAY.slice(0, 7),
            title: 'Organize garden rose fertilizer schedule',
            done: false
          }
        ],
        diaryEntries: {
          [DEFAULT_TODAY]: {
            content: 'Started using the streamlined Life Journal Hub today. Warm weather, morning coffee and a good walk.',
            updatedAt: new Date().toISOString()
          }
        },
        shoppingList: [
          {
            id: 'shop-1',
            name: 'Fresh prawns & baby spinach',
            category: 'Groceries',
            bought: false
          }
        ]
      };
    }

    let state = loadState();
    let diarySearchQuery = '';
    let expandedDiaryDates = {};
    let cleaningFilter = 'all';
    let cleaningEditId = null;
    let activeTodoMonth = null;
    let autoSyncTimer = null;

    function deepMerge(target, source) {
      if (!source || typeof source !== 'object') return target;
      const out = Array.isArray(target) ? [...target] : { ...target };
      for (const key of Object.keys(source)) {
        if (
          source[key] &&
          typeof source[key] === 'object' &&
          !Array.isArray(source[key]) &&
          target[key] &&
          typeof target[key] === 'object' &&
          !Array.isArray(target[key])
        ) {
          out[key] = deepMerge(target[key], source[key]);
        } else {
          out[key] = source[key];
        }
      }
      return out;
    }

    function loadState() {
      const base = createInitialState();
      try {
        let raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          for (const oldKey of LEGACY_KEYS) {
            const legacy = localStorage.getItem(oldKey);
            if (legacy) {
              raw = legacy;
              break;
            }
          }
        }
        if (raw) {
          const parsed = JSON.parse(raw);
          const merged = deepMerge(base, parsed);
          if (!merged.selectedDate) merged.selectedDate = getLocalTodayStr();
          return merged;
        }
      } catch (e) {
        console.error('Failed to load state:', e);
      }
      return base;
    }

    function saveState(skipCloud = false) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        console.error('Failed to save state:', e);
      }
      if (!skipCloud && state.cloud && state.cloud.autoSync && state.cloud.url && state.cloud.anonKey) {
        clearTimeout(autoSyncTimer);
        autoSyncTimer = setTimeout(() => {
          pushToCloud(true);
        }, 1200);
      }
    }

    function showToast(msg) {
      const el = document.getElementById('toast');
      if (!el) return;
      el.textContent = msg;
      el.classList.remove('hidden');
      clearTimeout(el._timer);
      el._timer = setTimeout(() => {
        el.classList.add('hidden');
      }, 2200);
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function parseYMD(dateStr) {
      const [y, m, d] = dateStr.split('-').map(Number);
      return new Date(y, m - 1, d);
    }

    function formatYMD(dateObj) {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function shiftDate(days) {
      const dt = parseYMD(state.selectedDate);
      dt.setDate(dt.getDate() + days);
      state.selectedDate = formatYMD(dt);
      activeTodoMonth = null;
      saveState(true);
      render();
    }

    function goToday() {
      state.selectedDate = getLocalTodayStr();
      activeTodoMonth = null;
      saveState(true);
      render();
    }

    function setSelectedDate(val) {
      if (!val) return;
      state.selectedDate = val;
      activeTodoMonth = null;
      saveState(true);
      render();
    }

    function toggleMobileFrame() {
      state.mobileFrame = !state.mobileFrame;
      document.body.classList.toggle('mobile-frame-mode', state.mobileFrame);
      saveState(true);
    }

    /* Calendar-Year Denominator Logic */
    function isLeapYear(year) {
      return (year % 4 === 0 && year % 100 !== 0) || year % 400 === 0;
    }

    function getYearDenominator(year) {
      const startStr = state.settings.startDate || DEFAULT_TODAY;
      const startDate = parseYMD(startStr);
      const startYear = startDate.getFullYear();
      if (year === startYear) {
        const endOfYear = new Date(year, 11, 31);
        const diffMs = endOfYear.getTime() - startDate.getTime();
        const remaining = Math.floor(diffMs / 86400000) + 1;
        return Math.max(1, remaining);
      }
      return isLeapYear(year) ? 366 : 365;
    }

    function getHealthLog(dateStr) {
      if (!state.healthLogs[dateStr]) {
        state.healthLogs[dateStr] = {
          exerciseDone: false,
          exerciseNote: '',
          meditationMinutes: 0,
          phoneControl: 'unset',
          massage: false,
          giDiscomfortCount: 0,
          periodStart: false
        };
      }
      return state.healthLogs[dateStr];
    }

    function getCycleCountdown() {
      const cycleLen = Math.max(20, Math.min(45, Number(state.settings.cycleLength) || 28));
      const periodDates = Object.keys(state.healthLogs)
        .filter(d => state.healthLogs[d] && state.healthLogs[d].periodStart && d <= state.selectedDate)
        .sort();
      const latestStart = periodDates.length > 0 ? periodDates[periodDates.length - 1] : state.settings.lastPeriodDate;
      if (!latestStart) return null;
      const start = parseYMD(latestStart);
      const current = parseYMD(state.selectedDate);
      const elapsed = Math.floor((current.getTime() - start.getTime()) / 86400000);
      if (elapsed < 0) return null;
      const mod = elapsed % cycleLen;
      return cycleLen - mod;
    }

    function computeYearStats(year) {
      const denom = getYearDenominator(year);
      const prefix = `${year}-`;
      let exerciseDays = 0;
      let meditationDays = 0;
      let meditationTotalMins = 0;
      let phoneControlDays = 0;
      let massageDays = 0;
      let giTotalEpisodes = 0;

      for (const [dateStr, log] of Object.entries(state.healthLogs)) {
        if (!dateStr.startsWith(prefix) || !log) continue;
        if (log.exerciseDone) exerciseDays++;
        const mins = Number(log.meditationMinutes) || 0;
        if (mins > 0) {
          meditationDays++;
          meditationTotalMins += mins;
        }
        if (log.phoneControl === 'yes') phoneControlDays++;
        if (log.massage) massageDays++;
        giTotalEpisodes += Number(log.giDiscomfortCount) || 0;
      }

      return {
        year,
        denom,
        exerciseDays,
        meditationDays,
        meditationTotalMins,
        phoneControlDays,
        massageDays,
        giTotalEpisodes
      };
    }

    function compute7DayStats() {
      const end = parseYMD(state.selectedDate);
      let ex = 0, medMins = 0, medDays = 0, phone = 0, massage = 0, gi = 0;
      for (let i = 0; i < 7; i++) {
        const d = new Date(end);
        d.setDate(end.getDate() - i);
        const key = formatYMD(d);
        const log = state.healthLogs[key];
        if (!log) continue;
        if (log.exerciseDone) ex++;
        const m = Number(log.meditationMinutes) || 0;
        if (m > 0) {
          medDays++;
          medMins += m;
        }
        if (log.phoneControl === 'yes') phone++;
        if (log.massage) massage++;
        gi += Number(log.giDiscomfortCount) || 0;
      }
      return { ex, medMins, medDays, phone, massage, gi };
    }

    function isDayActive(dateStr) {
      const log = state.healthLogs[dateStr];
      if (log) {
        if (log.exerciseDone || (Number(log.meditationMinutes) || 0) > 0 || log.phoneControl === 'yes' || log.massage || log.periodStart) {
          return true;
        }
      }
      const diary = state.diaryEntries[dateStr];
      if (diary && diary.content && diary.content.trim().length > 0) return true;
      if (state.familyItems.some(i => i.date === dateStr && i.done)) return true;
      if (state.specialCleaning.some(i => i.date === dateStr && i.done)) return true;
      return false;
    }

    function computeStreak() {
      let streak = 0;
      const cursor = parseYMD(state.selectedDate);
      while (true) {
        const key = formatYMD(cursor);
        if (isDayActive(key)) {
          streak++;
          cursor.setDate(cursor.getDate() - 1);
        } else {
          break;
        }
      }
      return streak;
    }

    /* Monthly Todo Helpers */
    function getMonthsWithTodos() {
      const map = new Map();
      for (const t of state.monthlyTodos) {
        if (!t || !t.month) continue;
        if (!map.has(t.month)) {
          map.set(t.month, { month: t.month, total: 0, done: 0 });
        }
        const entry = map.get(t.month);
        entry.total += 1;
        if (t.done) entry.done += 1;
      }
      return Array.from(map.values()).sort((a, b) => a.month.localeCompare(b.month));
    }

    function getCurrentTodoMonth() {
      if (activeTodoMonth) return activeTodoMonth;
      return state.selectedDate.slice(0, 7);
    }

    /* Navigation & Main Render */
    function setTab(tabId) {
      state.activeTab = tabId;
      saveState(true);
      render();
    }

    function renderNav() {
      const nav = document.getElementById('top-nav');
      if (!nav) return;
      nav.innerHTML = NAV_ITEMS.map(item => {
        const active = state.activeTab === item.id;
        return `
          <button
            type="button"
            onclick="setTab('${item.id}')"
            title="${item.label}"
            aria-label="${item.label}"
            class="btn-pill shrink-0 w-10 h-10 rounded-full flex items-center justify-center text-lg border ${
              active
                ? 'bg-[#3F6250] text-white border-[#3F6250] shadow-sm'
                : 'bg-[#FFFCF7] text-[#2B2623] border-[#E6DFD3] hover:bg-[#F3EDE2]'
            }"
          >
            ${item.icon}
          </button>
        `;
      }).join('');
    }

    function renderAchievements() {
      const container = document.getElementById('achievements-container');
      if (!container) return;
      const year = parseYMD(state.selectedDate).getFullYear();
      const stats = computeYearStats(year);
      const streak = computeStreak();
      const booksFinished = state.readingList.filter(b => b.status === 'finished').length;
      const diaryCount = Object.values(state.diaryEntries).filter(e => e && e.content && e.content.trim()).length;
      const tasksDone =
        state.monthlyTodos.filter(t => t.done).length +
        state.familyItems.filter(f => f.done).length +
        state.specialCleaning.filter(c => c.done).length;

      const badges = [
        { show: streak > 0, icon: '🔥', label: 'Streak', value: `${streak}d` },
        { show: stats.exerciseDays > 0, icon: '💪', label: 'Workouts', value: `${stats.exerciseDays}/${stats.denom}d` },
        { show: stats.meditationDays > 0, icon: '🧘', label: 'Meditation', value: `${stats.meditationDays}/${stats.denom}d` },
        { show: stats.phoneControlDays > 0, icon: '📵', label: 'Phone Control', value: `${stats.phoneControlDays}/${stats.denom}d` },
        { show: stats.massageDays > 0, icon: '💆', label: 'Massage', value: `${stats.massageDays}/${stats.denom}d` },
        { show: booksFinished > 0, icon: '📚', label: 'Books Finished', value: `${booksFinished}` },
        { show: diaryCount > 0, icon: '✍️', label: 'Diary Entries', value: `${diaryCount}` },
        { show: tasksDone > 0, icon: '✅', label: 'Tasks Done', value: `${tasksDone}` }
      ].filter(b => b.show);

      if (badges.length === 0) {
        container.innerHTML = '';
        return;
      }

      container.innerHTML = `
        <div class="card px-3 py-2.5 bg-[#FFFCF7]">
          <div class="flex items-center gap-1.5 mb-2">
            <span class="text-xs font-semibold uppercase tracking-wider text-[#786E65]">✨ Achievements (${year})</span>
          </div>
          <div class="flex flex-wrap gap-1.5">
            ${badges
              .map(
                b => `

    function renderHome() {

      const cycleDays = getCycleCountdown();

      const todayFamily = state.familyItems.filter(i => i.date === d);
      const todayCleaning = state.specialCleaning.filter(i => i.date === d);

      const monthTodos = state.monthlyTodos.filter(t => t.month === currentMonth);

      const diaryText = (state.diaryEntries[d] && state.diaryEntries[d].content) || '';

      return `

              ${
                cycleDays !== null
                  ? `<span class="px-2 py-0.5 rounded-full text-xs font-medium bg-[#F9ECEE] text-[#A84A5C] border border-[#EED3D8]">🩸 ${cycleDays} days</span>`

              }
            </div>
            <button type="button" onclick="setTab('health')" class="text-xs text-[#786E65] hover:text-[#2B2623]">→</button>

          <div class="flex items-center justify-between gap-2 bg-[#FAF7F2] px-3 py-2 rounded-xl border border-[#EDE7DC]">

        <!-- 5. Monthly Todo Card -->
        <section class="card p-3.5 space-y-2.5">
          <div class="flex items-center justify-between">
            <button type="button" onclick="setTab('todo')" class="text-lg leading-none" title="Monthly Todo" aria-label="Monthly Todo">📅</button>

          ${
            monthsWithTodos.length > 0

                        m.month === currentMonth

                          : 'bg-[#FAF7F2] border-[#E6DFD3] text-[#786E65]'
                      }"
                    >
                      ${m.month} (${m.done}/${m.total})
                    </button>

                    )
                    .join('')}
                </div>`
              : ''

          ${
            monthTodos.length > 0
              ? `<div class="space-y-1.5">
                  ${monthTodos
                    .slice(0, 4)
                    .map(
                      t => `
                    <label class="flex items-center gap-2.5 text-sm bg-[#FAF7F2] px-3 py-1.5 rounded-xl border border-[#EDE7DC] cursor-pointer">
                      <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTodoItem('${t.id}')" class="w-4 h-4 accent-[#3F6250]" />
                      <span class="truncate ${t.done ? 'line-through text-[#786E65]' : ''}">${escapeHtml(t.title)}</span>
                    </label>
                  `
                    )
                    .join('')}
                </div>`
              : `<p class="text-xs text-[#786E65] px-1">No todos for ${currentMonth}.</p>`
          }
        </section>

        <!-- 6. Diary Card -->
        <section class="card p-3.5 space-y-2">
          <div class="flex items-center justify-between">
            <button type="button" onclick="setTab('diary')" class="text-lg leading-none" title="Diary" aria-label="Diary">✍️</button>

            rows="3"
            placeholder="Write today's note..."
            oninput="updateDiaryContent(this.value)"
            class="w-full p-2.5 text-sm bg-[#FAF7F2] border border-[#EDE7DC] rounded-xl resize-none"
          >${escapeHtml(diaryText)}</textarea>
        </section>

        <!-- 7. Shopping List Card -->
        <section class="card p-3.5 space-y-2.5">
          <div class="flex items-center justify-between">
            <button type="button" onclick="setTab('shopping')" class="text-lg leading-none" title="Shopping List" aria-label="Shopping List">🛒</button>
            <button type="button" onclick="openQuickAdd('shopping')" class="w-7 h-7 rounded-full bg-[#EBF1ED] text-[#3F6250] flex items-center justify-center text-xs font-bold" title="Quick Add Item" aria-label="Quick Add Item">➕</button>
          </div>
          ${
            pendingShop.length > 0
              ? `<div class="flex flex-wrap gap-1.5">
                  ${pendingShop
                    .map(
                      s => `
                    <button
                      type="button"
                      onclick="toggleShoppingItem('${s.id}')"
                      class="px-2.5 py-1 rounded-full text-xs bg-[#FAF7F2] border border-[#E6DFD3] hover:bg-[#EBF1ED] text-[#2B2623]"
                    >
                      ○ ${escapeHtml(s.name)}
                    </button>
                  `
                    )
                    .join('')}
                </div>`
              : `<p class="text-xs text-[#786E65] px-1">Shopping list is clear.</p>`
          }
        </section>
      `;
    }

    /* Subpage: Diary (Single Free-Text Body + Reverse-Chronological Archive) */
    function renderDiaryPage() {
      const d = state.selectedDate;
      const currentContent = (state.diaryEntries[d] && state.diaryEntries[d].content) || '';

      const allEntries = Object.entries(state.diaryEntries)
        .filter(([dateKey, entry]) => entry && entry.content && entry.content.trim().length > 0)
        .sort((a, b) => b[0].localeCompare(a[0]))
        .filter(([dateKey, entry]) => {
          if (!diarySearchQuery.trim()) return true;
          const q = diarySearchQuery.toLowerCase();
          return dateKey.includes(q) || entry.content.toLowerCase().includes(q);
        });

      return `
        <div class="card p-4 space-y-2.5">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <span class="text-xl">📖</span>
              <h2 class="text-base font-semibold">Diary — ${d}</h2>
            </div>
            <span class="text-xs text-[#786E65]">${currentContent.trim().length} chars</span>
          </div>

          <textarea
            rows="6"
            placeholder="Write today's diary entry..."
            oninput="updateDiaryContent(this.value)"
            class="w-full p-3 text-sm bg-[#FAF7F2] border border-[#EDE7DC] rounded-xl leading-relaxed"
          >${escapeHtml(currentContent)}</textarea>
        </div>

        <div class="card p-4 space-y-3">
          <div class="flex items-center justify-between gap-2">
            <h3 class="text-sm font-semibold">Written Entries (${allEntries.length})</h3>
            <input
              type="text"
              value="${escapeHtml(diarySearchQuery)}"
              oninput="setDiarySearch(this.value)"
              placeholder="Search date or text..."
              class="w-44 h-8 px-2.5 text-xs"
            />
          </div>

          <div class="space-y-2">
            ${
              allEntries.length === 0
                ? `<p class="text-xs text-[#786E65]">No written entries found.</p>`
                : allEntries
                    .map(([dateKey, entry]) => {
                      const text = entry.content.trim();
                      const isLong = text.length > 140;
                      const expanded = !!expandedDiaryDates[dateKey];
                      const shownText = isLong && !expanded ? text.slice(0, 140) + '…' : text;
                      return `
                        <div class="bg-[#FAF7F2] p-3 rounded-xl border ${
                          dateKey === d ? 'border-[#3F6250]' : 'border-[#EDE7DC]'
                        } space-y-1.5">
                          <div class="flex items-center justify-between">
                            <button
                              type="button"
                              onclick="setSelectedDate('${dateKey}')"
                              class="text-xs font-semibold text-[#3F6250] hover:underline"
                            >
                              📅 ${dateKey} (${text.length} chars)
                            </button>
                            <div class="flex items-center gap-2">
                              ${
                                isLong
                                  ? `<button type="button" onclick="toggleDiaryExpand('${dateKey}')" class="text-[11px] text-[#786E65] hover:text-[#2B2623]">${
                                      expanded ? 'Collapse' : 'Expand'
                                    }</button>`
                                  : ''
                              }
                              <button type="button" onclick="deleteDiaryEntry('${dateKey}')" class="text-xs text-[#786E65] hover:text-[#A84A5C]" title="Delete Entry">✕</button>
                            </div>
                          </div>
                          <p onclick="setSelectedDate('${dateKey}')" class="text-sm text-[#2B2623] whitespace-pre-wrap cursor-pointer">${escapeHtml(shownText)}</p>
                        </div>
                      `;
                    })
                    .join('')
            }
          </div>
        </div>
      `;
    }

    /* Data Mutations */
    function updateHealthField(field, value) {
      const log = getHealthLog(state.selectedDate);
      log[field] = value;
      saveState();
      render();
    }

    function adjustGiCount(delta) {
      const log = getHealthLog(state.selectedDate);
      log.giDiscomfortCount = Math.max(0, (Number(log.giDiscomfortCount) || 0) + delta);
      saveState();
      render();
    }

    function togglePeriodStart(checked) {
      const log = getHealthLog(state.selectedDate);
      log.periodStart = checked;
      if (checked) {
        state.settings.lastPeriodDate = state.selectedDate;
      }
      saveState();
      render();
    }

    function addLearningItem(e) {
      e.preventDefault();
      const title = document.getElementById('new-learn-title').value.trim();
      const status = document.getElementById('new-learn-status').value;
      const progress = Math.min(100, Math.max(0, Number(document.getElementById('new-learn-progress').value) || 0));
      if (!title) return;
      state.learningItems.unshift({
        id: 'learn-' + Date.now(),
        title,
        status,
        progress: status === 'completed' ? 100 : progress
      });
      saveState();
      render();
    }

    function updateLearningItem(id, field, val) {
      const item = state.learningItems.find(i => i.id === id);
      if (item) {
        item[field] = val;
        if (field === 'status' && val === 'completed') item.progress = 100;
        saveState();
        render();
      }
    }

    function deleteLearningItem(id) {
      state.learningItems = state.learningItems.filter(i => i.id !== id);
      saveState();
      render();
    }

    function addFamilyItem(e) {
      e.preventDefault();
      const date = document.getElementById('new-fam-date').value || state.selectedDate;
      const title = document.getElementById('new-fam-title').value.trim();
      if (!title) return;
      state.familyItems.unshift({ id: 'fam-' + Date.now(), date, title, done: false });
      saveState();
      render();
    }

    function toggleFamilyItem(id) {
      const item = state.familyItems.find(i => i.id === id);
      if (item) {
        item.done = !item.done;
        saveState();
        render();
      }
    }

    function deleteFamilyItem(id) {
      state.familyItems = state.familyItems.filter(i => i.id !== id);
      saveState();
      render();
    }

    function setCleaningFilter(f) {
      cleaningFilter = f;
      render();
    }

    function startCleaningEdit(id) {
      cleaningEditId = id;
      render();
    }

    function cancelCleaningEdit() {
      cleaningEditId = null;
      render();
    }

    function addCleaningItem(e) {
      e.preventDefault();
      const date = document.getElementById('clean-date').value || state.selectedDate;
      const area = document.getElementById('clean-area').value.trim();
      const task = document.getElementById('clean-task').value.trim();
      const priority = document.getElementById('clean-priority').value;
      const notes = document.getElementById('clean-notes').value.trim();
      if (!task) return;
      state.specialCleaning.push({
        id: 'clean-' + Date.now(),
        date,
        area,
        task,
        priority,
        notes,
        done: false
      });
      saveState();
      render();
      showToast('Cleaning task scheduled');
    }

    function saveCleaningEdit(id) {
      const item = state.specialCleaning.find(c => c.id === id);
      if (!item) return;
      item.date = document.getElementById(`edit-clean-date-${id}`).value || item.date;
      item.area = document.getElementById(`edit-clean-area-${id}`).value.trim();
      item.task = document.getElementById(`edit-clean-task-${id}`).value.trim() || item.task;
      item.notes = document.getElementById(`edit-clean-notes-${id}`).value.trim();
      cleaningEditId = null;
      saveState();
      render();
    }

    function toggleCleaningItem(id) {
      const item = state.specialCleaning.find(c => c.id === id);
      if (item) {
        item.done = !item.done;
        saveState();
        render();
      }
    }

    function deleteCleaningItem(id) {
      state.specialCleaning = state.specialCleaning.filter(c => c.id !== id);
      saveState();
      render();
    }

    function addBookItem(e) {
      e.preventDefault();
      const title = document.getElementById('book-title').value.trim();
      const author = document.getElementById('book-author').value.trim();
      const status = document.getElementById('book-status').value;
      if (!title) return;
      state.readingList.unshift({ id: 'book-' + Date.now(), title, author, status });
      saveState();
      render();
    }

    function updateBookStatus(id, status) {
      const book = state.readingList.find(b => b.id === id);
      if (book) {
        book.status = status;
        saveState();
        render();
      }
    }

    function deleteBookItem(id) {
      state.readingList = state.readingList.filter(b => b.id !== id);
      saveState();
      render();
    }

    function setTodoMonth(monthStr) {
      activeTodoMonth = monthStr || state.selectedDate.slice(0, 7);
      render();
    }

    function jumpToTodoMonth(monthStr) {
      activeTodoMonth = monthStr;
      setTab('todo');
    }

    function addTodoItem(e) {
      e.preventDefault();
      const title = document.getElementById('todo-title').value.trim();
      const monthInput = document.getElementById('todo-target-month');
      const month = (monthInput && monthInput.value) || getCurrentTodoMonth();
      if (!title) return;
      activeTodoMonth = month;
      state.monthlyTodos.unshift({
        id: 'todo-' + Date.now(),
        month,
        title,
        done: false
      });
      saveState();
      render();
    }

    function toggleTodoItem(id) {
      const todo = state.monthlyTodos.find(t => t.id === id);
      if (todo) {
        todo.done = !todo.done;
        saveState();
        render();
      }
    }

    function deleteTodoItem(id) {
      state.monthlyTodos = state.monthlyTodos.filter(t => t.id !== id);
      saveState();
      render();
    }

    function updateDiaryContent(val) {
      const d = state.selectedDate;
      if (!state.diaryEntries[d]) {
        state.diaryEntries[d] = { content: '', updatedAt: new Date().toISOString() };
      }
      state.diaryEntries[d].content = val;
      state.diaryEntries[d].updatedAt = new Date().toISOString();
      saveState();
      renderAchievements();
    }

    function setDiarySearch(q) {
      diarySearchQuery = q;
      render();
    }

    function toggleDiaryExpand(dateKey) {
      expandedDiaryDates[dateKey] = !expandedDiaryDates[dateKey];
      render();
    }

    function deleteDiaryEntry(dateKey) {
      delete state.diaryEntries[dateKey];
      saveState();
      render();
      showToast('Diary entry deleted');
    }

    function addShoppingItem(e) {
      e.preventDefault();
      const name = document.getElementById('shop-name').value.trim();
      if (!name) return;
      state.shoppingList.unshift({ id: 'shop-' + Date.now(), name, bought: false });
      saveState();
      render();
    }

    function toggleShoppingItem(id) {
      const item = state.shoppingList.find(s => s.id === id);
      if (item) {
        item.bought = !item.bought;
        saveState();
        render();
      }
    }

    function clearBoughtShopping() {
      state.shoppingList = state.shoppingList.filter(s => !s.bought);
      saveState();
      render();
    }

    function deleteShoppingItem(id) {
      state.shoppingList = state.shoppingList.filter(s => s.id !== id);
      saveState();
      render();
    }

    /* Modals: Quick Add / Settings / Cloud Sync / Reset */
    function openModal(type) {
      const backdrop = document.getElementById('modal-backdrop');
      const box = document.getElementById('modal-box');
      if (!backdrop || !box) return;
      backdrop.classList.remove('hidden');

      if (type === 'settings') {
        box.innerHTML = `
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-sm font-semibold">⚙️ Tracking Start & Cycle Settings</h3>
            <button type="button" onclick="closeModal()" class="text-xs text-[#786E65]">✕</button>
          </div>
          <div class="space-y-3 text-xs">
            <div>
              <label class="block text-[#786E65] mb-1">Tracking Start Date (Remaining-days denominator in start year)</label>
              <input type="date" id="set-start-date" value="${escapeHtml(state.settings.startDate || DEFAULT_TODAY)}" class="w-full h-9 px-2.5 text-sm" />
            </div>
            <div>
              <label class="block text-[#786E65] mb-1">Last Period Start Date</label>
              <input type="date" id="set-last-period" value="${escapeHtml(state.settings.lastPeriodDate || '')}" class="w-full h-9 px-2.5 text-sm" />
            </div>
            <div>
              <label class="block text-[#786E65] mb-1">Cycle Length (days)</label>
              <input type="number" id="set-cycle-len" min="20" max="45" value="${escapeHtml(state.settings.cycleLength || 28)}" class="w-full h-9 px-2.5 text-sm" />
            </div>
            <div class="flex justify-end gap-2 pt-2">
              <button type="button" onclick="closeModal()" class="px-3 h-8 rounded-xl border border-[#E6DFD3]">Cancel</button>
              <button type="button" onclick="saveSettingsModal()" class="px-4 h-8 rounded-xl bg-[#3F6250] text-white font-medium">Save</button>
            </div>
          </div>
        `;
      } else if (type === 'cloud') {
        const c = state.cloud || {};
        box.innerHTML = `
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-sm font-semibold">☁️ Supabase Cloud Sync</h3>
            <button type="button" onclick="closeModal()" class="text-xs text-[#786E65]">✕</button>
          </div>
          <div class="space-y-2.5 text-xs">
            <div>
              <label class="block text-[#786E65] mb-1">Supabase Project URL</label>
              <input type="text" id="cloud-url" value="${escapeHtml(c.url || '')}" placeholder="https://xxxx.supabase.co" class="w-full h-9 px-2.5 text-sm" />
            </div>
            <div>
              <label class="block text-[#786E65] mb-1">Anon Key</label>
              <input type="password" id="cloud-key" value="${escapeHtml(c.anonKey || '')}" placeholder="eyJ..." class="w-full h-9 px-2.5 text-sm" />
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-[#786E65] mb-1">Table Name</label>
                <input type="text" id="cloud-table" value="${escapeHtml(c.table || 'life_journal_state')}" class="w-full h-9 px-2.5 text-sm" />
              </div>
              <div>
                <label class="block text-[#786E65] mb-1">Record ID</label>
                <input type="text" id="cloud-id" value="${escapeHtml(c.recordId || 'default_user')}" class="w-full h-9 px-2.5 text-sm" />
              </div>
            </div>
            <label class="flex items-center gap-2 pt-1 cursor-pointer">
              <input type="checkbox" id="cloud-autosync" ${c.autoSync ? 'checked' : ''} class="w-4 h-4 accent-[#3F6250]" />
              <span>Enable Auto-Sync on change</span>
            </label>
            ${c.lastSynced ? `<div class="text-[11px] text-[#786E65]">Last synced: ${escapeHtml(c.lastSynced)}</div>` : ''}
            <div class="flex flex-wrap justify-between gap-2 pt-2">
              <div class="flex gap-1.5">
                <button type="button" onclick="saveCloudConfig(); pullFromCloud();" class="px-3 h-8 rounded-xl bg-[#FAF7F2] border border-[#E6DFD3] font-medium">Pull</button>
                <button type="button" onclick="saveCloudConfig(); pushToCloud();" class="px-3 h-8 rounded-xl bg-[#FAF7F2] border border-[#E6DFD3] font-medium">Push</button>
              </div>
              <button type="button" onclick="saveCloudConfig(); closeModal();" class="px-4 h-8 rounded-xl bg-[#3F6250] text-white font-medium">Save</button>
            </div>
          </div>
        `;
      }
    }

    function openQuickAdd(kind) {
      const backdrop = document.getElementById('modal-backdrop');
      const box = document.getElementById('modal-box');
      if (!backdrop || !box) return;
      backdrop.classList.remove('hidden');

      if (kind === 'reading') {
        box.innerHTML = `
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-sm font-semibold">📖 Quick Add Book</h3>
            <button type="button" onclick="closeModal()" class="text-xs text-[#786E65]">✕</button>
          </div>
          <form onsubmit="submitQuickAdd(event, 'reading')" class="space-y-2.5">
            <input type="text" id="qa-title" required placeholder="Book title..." class="w-full h-9 px-3 text-sm" autofocus />
            <input type="text" id="qa-sub" placeholder="Author (optional)" class="w-full h-8 px-3 text-xs" />
            <div class="flex justify-end gap-2 pt-1">
              <button type="button" onclick="closeModal()" class="px-3 h-8 rounded-xl border border-[#E6DFD3] text-xs">Cancel</button>
              <button type="submit" class="px-4 h-8 rounded-xl bg-[#3F6250] text-white text-xs font-medium">Add</button>
            </div>
          </form>
        `;
      } else if (kind === 'todo') {
        const defaultMonth = getCurrentTodoMonth();
        box.innerHTML = `
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-sm font-semibold">📅 Quick Add Monthly Todo</h3>
            <button type="button" onclick="closeModal()" class="text-xs text-[#786E65]">✕</button>
          </div>
          <form onsubmit="submitQuickAdd(event, 'todo')" class="space-y-2.5">
            <input type="month" id="qa-month" value="${defaultMonth}" required class="w-full h-9 px-3 text-sm" />
            <input type="text" id="qa-title" required placeholder="Task..." class="w-full h-9 px-3 text-sm" autofocus />
            <div class="flex justify-end gap-2 pt-1">
              <button type="button" onclick="closeModal()" class="px-3 h-8 rounded-xl border border-[#E6DFD3] text-xs">Cancel</button>
              <button type="submit" class="px-4 h-8 rounded-xl bg-[#3F6250] text-white text-xs font-medium">Add</button>
            </div>
          </form>
        `;
      } else if (kind === 'shopping') {
        box.innerHTML = `
          <div class="flex items-center justify-between mb-3">
            <h3 class="text-sm font-semibold">🛒 Quick Add Shopping Item</h3>
            <button type="button" onclick="closeModal()" class="text-xs text-[#786E65]">✕</button>
          </div>
          <form onsubmit="submitQuickAdd(event, 'shopping')" class="space-y-2.5">
            <input type="text" id="qa-title" required placeholder="Item..." class="w-full h-9 px-3 text-sm" autofocus />
            <div class="flex justify-end gap-2 pt-1">
              <button type="button" onclick="closeModal()" class="px-3 h-8 rounded-xl border border-[#E6DFD3] text-xs">Cancel</button>
              <button type="submit" class="px-4 h-8 rounded-xl bg-[#3F6250] text-white text-xs font-medium">Add</button>
            </div>
          </form>
        `;
      }
    }

    function openResetModal() {
      const backdrop = document.getElementById('modal-backdrop');
      const box = document.getElementById('modal-box');
      if (!backdrop || !box) return;
      backdrop.classList.remove('hidden');
      box.innerHTML = `
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-sm font-semibold">♻️ Reset Local Data</h3>
          <button type="button" onclick="closeModal()" class="text-xs text-[#786E65]">✕</button>
        </div>
        <p class="text-xs text-[#786E65] mb-3">
          Reset all local data back to the initial sample state? Export a JSON backup first if you want to keep your entries.
        </p>
        <div class="flex justify-end gap-2">
          <button type="button" onclick="closeModal()" class="px-3 h-8 rounded-xl border border-[#E6DFD3] text-xs">Cancel</button>
          <button type="button" onclick="performReset()" class="px-4 h-8 rounded-xl bg-[#A84A5C] text-white text-xs font-medium">Reset</button>
        </div>
      `;
    }

    function performReset() {
      try {
        localStorage.removeItem(STORAGE_KEY);
      } catch (e) {
        console.error('Failed to clear storage:', e);
      }
      state = createInitialState();
      activeTodoMonth = null;
      saveState(true);
      closeModal();
      render();
      showToast('Data reset');
    }

    function submitQuickAdd(e, kind) {
      e.preventDefault();
      const title = document.getElementById('qa-title').value.trim();
      if (!title) return;
      if (kind === 'reading') {
        const author = (document.getElementById('qa-sub') && document.getElementById('qa-sub').value.trim()) || '';
        state.readingList.unshift({ id: 'book-' + Date.now(), title, author, status: 'reading' });
      } else if (kind === 'todo') {
        const monthInput = document.getElementById('qa-month');
        const month = (monthInput && monthInput.value) || getCurrentTodoMonth();
        activeTodoMonth = month;
        state.monthlyTodos.unshift({ id: 'todo-' + Date.now(), month, title, done: false });
      } else if (kind === 'shopping') {
        state.shoppingList.unshift({ id: 'shop-' + Date.now(), name: title, bought: false });
      }
      saveState();
      closeModal();
      render();
    }

    function closeModal() {
      const backdrop = document.getElementById('modal-backdrop');
      if (backdrop) backdrop.classList.add('hidden');
    }

    function saveSettingsModal() {
      state.settings.startDate = document.getElementById('set-start-date').value || DEFAULT_TODAY;
      state.settings.lastPeriodDate = document.getElementById('set-last-period').value || '';
      state.settings.cycleLength = Math.max(20, Math.min(45, Number(document.getElementById('set-cycle-len').value) || 28));
      saveState();
      closeModal();
      render();
      showToast('Settings saved');
    }

    /* Supabase Cloud Sync Helpers */
    function saveCloudConfig() {
      state.cloud = {
        ...(state.cloud || {}),
        url: document.getElementById('cloud-url').value.trim(),
        anonKey: document.getElementById('cloud-key').value.trim(),
        table: document.getElementById('cloud-table').value.trim() || 'life_journal_state',
        recordId: document.getElementById('cloud-id').value.trim() || 'default_user',
        autoSync: !!document.getElementById('cloud-autosync').checked
      };
      saveState(true);
      updateSyncIndicator();
    }

    function getSupabaseClient() {
      const c = state.cloud;
      if (!c || !c.url || !c.anonKey || !window.supabase || typeof window.supabase.createClient !== 'function') {
        return null;
      }
      try {
        return window.supabase.createClient(c.url, c.anonKey);
      } catch (e) {
        console.error('Supabase client error:', e);
        return null;
      }
    }

    async function pushToCloud(silent = false) {
      const client = getSupabaseClient();
      if (!client) {
        if (!silent) openModal('cloud');
        return;
      }
      const c = state.cloud;
      const payload = {
        id: c.recordId || 'default_user',
        payload: state,
        updated_at: new Date().toISOString()
      };
      try {
        const { error } = await client.from(c.table || 'life_journal_state').upsert(payload, { onConflict: 'id' });
        if (error) {
          if (!silent) showToast('Cloud push failed');
          console.error(error);
        } else {
          state.cloud.lastSynced = new Date().toLocaleTimeString();
          saveState(true);
          updateSyncIndicator();
          if (!silent) showToast('Synced to cloud');
        }
      } catch (err) {
        if (!silent) showToast('Cloud push error');
        console.error(err);
      }
    }

    async function pullFromCloud() {
      const client = getSupabaseClient();
      if (!client) {
        openModal('cloud');
        return;
      }
      const c = state.cloud;
      try {
        const { data, error } = await client
          .from(c.table || 'life_journal_state')
          .select('payload')
          .eq('id', c.recordId || 'default_user')
          .single();
        if (error || !data || !data.payload) {
          showToast('Cloud pull failed');
          console.error(error);
        } else {
          const savedCloud = { ...state.cloud, lastSynced: new Date().toLocaleTimeString() };
          state = deepMerge(createInitialState(), data.payload);
          state.cloud = savedCloud;
          saveState(true);
          render();
          showToast('Pulled from cloud');
        }
      } catch (err) {
        showToast('Cloud pull error');
        console.error(err);
      }
    }

    function syncNow() {
      if (!state.cloud || !state.cloud.url || !state.cloud.anonKey) {
        openModal('cloud');
        return;
      }
      pushToCloud(false);
    }

    function toggleAutoSync() {
      if (!state.cloud || !state.cloud.url || !state.cloud.anonKey) {
        openModal('cloud');
        return;
      }
      state.cloud.autoSync = !state.cloud.autoSync;
      saveState(true);
      updateSyncIndicator();
      showToast(state.cloud.autoSync ? 'Auto-Sync ON' : 'Auto-Sync OFF');
    }

    function updateSyncIndicator() {
      const dot = document.getElementById('sync-status-dot');
      const autoBtn = document.getElementById('auto-sync-btn');
      const hasCloud = !!(state.cloud && state.cloud.url && state.cloud.anonKey);
      if (dot) {
        dot.className = `inline-block w-2 h-2 rounded-full ${
          hasCloud ? (state.cloud.autoSync ? 'bg-[#3F6250]' : 'bg-[#A66E2E]') : 'bg-[#B5ABA0]'
        }`;
      }
      if (autoBtn) {
        autoBtn.className = `btn-pill w-8 h-8 rounded-xl border flex items-center justify-center text-sm ${
          state.cloud && state.cloud.autoSync
            ? 'bg-[#EBF1ED] border-[#3F6250] text-[#3F6250]'
            : 'bg-[#FAF7F2] border-[#E6DFD3]'
        }`;
      }
    }

    /* Export / Import */
    function exportJSON() {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `life-journal-hub-${state.selectedDate}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Backup exported');
    }

    function importJSON(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const parsed = JSON.parse(e.target.result);
          state = deepMerge(createInitialState(), parsed);
          saveState(true);
          render();
          showToast('Backup imported');
        } catch (err) {
          showToast('Invalid JSON file');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }

    /* Master Render */
    function render() {
      document.body.classList.toggle('mobile-frame-mode', !!state.mobileFrame);
      const headerLabel = document.getElementById('header-date-label');
      if (headerLabel) headerLabel.textContent = state.selectedDate;
      const picker = document.getElementById('footer-date-picker');
      if (picker && picker.value !== state.selectedDate) {
        picker.value = state.selectedDate;
      }

      renderNav();
      updateSyncIndicator();

      const main = document.getElementById('main-content');
      if (!main) return;
      switch (state.activeTab) {
        case 'health':
          main.innerHTML = renderHealthPage();
          break;
        case 'learning':
          main.innerHTML = renderLearningPage();
          break;
        case 'family':
          main.innerHTML = renderFamilyPage();
          break;
        case 'reading':
          main.innerHTML = renderReadingPage();
          break;
        case 'todo':
          main.innerHTML = renderTodoPage();
          break;
        case 'diary':
          main.innerHTML = renderDiaryPage();
          break;
        case 'shopping':
          main.innerHTML = renderShoppingPage();
          break;
        case 'home':
        default:
          main.innerHTML = renderHome();
          break;
      }

      renderAchievements();
    }

    document.getElementById('modal-backdrop').addEventListener('click', e => {
      if (e.target.id === 'modal-backdrop') closeModal();
    });

    render();
  </script>
</body>
</html>
